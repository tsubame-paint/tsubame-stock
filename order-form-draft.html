<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>受注フォーム（仮UI・v3）</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --danger: #dc2626;
      --chip-bg: #f8fafc;
      --chip-border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
    }
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .sub { color: var(--muted); font-size: 12px; }
    .badge {
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: 700; color: #334155; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: var(--primary);
    }
    textarea { min-height: 58px; resize: vertical; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }
    .chips-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px; }
    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: #1e293b;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { background: #eff6ff; border-color: #93c5fd; color: var(--primary); }
    .item-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .item-badge { font-weight: 700; font-size: 13px; color: #0f172a; }
    .item-actions { display: flex; gap: 6px; align-items: center; }
    .item-row-upper {
      display: grid;
      grid-template-columns: 1.1fr 1.6fr 1.1fr 0.9fr 1.2fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .item-row-lower {
      display: grid;
      grid-template-columns: 1fr 0.8fr 0.8fr 1.4fr;
      gap: 8px;
    }
    @media (max-width: 860px) {
      .item-row-upper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .item-row-lower { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .item-row-upper, .item-row-lower { grid-template-columns: 1fr; }
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); color: #334155; padding: 4px 9px; font-size: 12px; }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-danger { background: #fee2e2; color: var(--danger); padding: 4px 9px; font-size: 12px; }
    .btn-danger:hover { background: #fecaca; }
    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
      margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>受注フォーム（仮UI・v3）</h1>
        <div class="sub">メーカー→商品マスター絞り込み / 品名→履歴から艶・色・容量絞り込み＆前回値自動初期値化</div>
      </div>
      <span class="badge">明細 1〜6行対応</span>
    </div>

    <form id="orderForm">
      <!-- 1. 基本・納品情報 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">1. 基本・納品情報</h2>
          <div class="btn-group">
            <button type="button" class="btn-ghost" id="clearBasicBtn">基本情報をクリア</button>
          </div>
        </div>

        <div class="grid-4">
          <div class="field">
            <label for="issuer">発行者</label>
            <input id="issuer" name="発行者" type="text" list="issuerList" value="今井" />
          </div>
          <div class="field">
            <label for="userName">ユーザー名（得意先・在庫）</label>
            <input id="userName" name="ユーザー名" type="text" list="userList" placeholder="例：中澤塗装㈱ / 在庫" required />
          </div>
          <div class="field">
            <label for="contactPerson">担当者</label>
            <input id="contactPerson" name="担当者" type="text" list="contactList" placeholder="例：青柳 / 主任" />
          </div>
          <div class="field">
            <label for="phone">電話番号</label>
            <input id="phone" name="電話番号" type="tel" list="phoneList" placeholder="例：090-0000-0000" />
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="field">
            <label for="siteName">現場名</label>
            <input id="siteName" name="現場名" type="text" placeholder="例：〇〇邸 / 倉庫" />
          </div>
          <div class="field">
            <label for="deliveryDate">希望納期</label>
            <input id="deliveryDate" name="希望納期" type="date" />
          </div>
          <div class="field">
            <label for="deliveryTime">納期時間帯</label>
            <select id="deliveryTime" name="納期時間帯">
              <option value="">指定なし</option>
              <option value="AM">AM</option>
              <option value="PM">PM</option>
              <option value="至急">至急</option>
            </select>
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="field">
            <label for="destination">届け先</label>
            <select id="destination" name="届け先">
              <option value="貴社">貴社</option>
              <option value="現場">現場</option>
              <option value="店渡し">店渡し</option>
              <option value="直送">直送</option>
              <option value="現場直送">現場直送</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="field">
            <label for="deliveryRequest">配達依頼</label>
            <input id="deliveryRequest" name="配達依頼" type="text" list="deliveryReqList" placeholder="例：前橋 / 現場直送 / 白岡引き取り" />
          </div>
          <div class="field">
            <label for="orderSource">発注先</label>
            <input id="orderSource" name="発注先" type="text" list="makerList" placeholder="例：メーカー名・仕入先" />
          </div>
        </div>

        <div class="field" style="margin-top: 10px;">
          <label for="siteAddress">現場住所</label>
          <input id="siteAddress" name="現場住所" type="text" placeholder="例：〒360-0000 埼玉県熊谷市..." />
        </div>

        <div class="field" style="margin-top: 10px;">
          <label for="etcNote">etc.（備考・追加／引き取り／納品条件）</label>
          <textarea id="etcNote" name="etc." placeholder="例：追加分、引き取り予定、納品条件など"></textarea>
        </div>

        <div class="chips">
          <span class="chips-label">クイック入力:</span>
          <button type="button" class="chip" data-preset="stock">在庫（貴社）</button>
          <button type="button" class="chip" data-preset="store">店渡し（本日）</button>
          <button type="button" class="chip" data-preset="site">現場納品</button>
          <button type="button" class="chip" data-preset="direct">直送</button>
          <button type="button" class="chip" data-preset="tomorrow-am">明日AM</button>
        </div>
      </div>

      <!-- 2. 受注明細 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">2. 受注明細（1〜6行）</h2>
          <div class="btn-group">
            <button type="button" class="btn-secondary" id="addItemBtn">＋ 明細を追加</button>
          </div>
        </div>
        <div id="itemsContainer"></div>
      </div>

      <!-- 3. 送信・流し込み確認 -->
      <div class="card">
        <h2 class="card-title">3. 送信・流し込み確認</h2>
        <div class="field" style="margin-top: 10px;">
          <label for="gasUrl">GAS WebアプリURL（任意・空欄なら画面プレビューのみ）</label>
          <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/xxxxx/exec" />
        </div>
        <div class="footer-bar">
          <div class="btn-group">
            <button type="button" class="btn-secondary" id="previewBtn">JSONプレビュー更新</button>
            <button type="submit" class="btn-primary" id="submitBtn">フォーム送信</button>
          </div>
          <span id="statusText" class="sub">準備完了</span>
        </div>
        <pre id="jsonPreview">{}</pre>
      </div>
    </form>
  </div>

  <!-- 共通サジェスト -->
  <datalist id="issuerList">
    <option value="今井"></option>
    <option value="佐々木"></option>
  </datalist>
  <datalist id="userList">
    <option value="在庫"></option>
    <option value="中澤塗装㈱"></option>
    <option value="ケイスタイル㈱"></option>
    <option value="㈱彩心"></option>
    <option value="㈱おんだ塗装"></option>
    <option value="㈲アベル"></option>
    <option value="川村塗装"></option>
    <option value="木下塗装興業"></option>
    <option value="㈱ハシ塗装工業"></option>
    <option value="吉岡塗装工業"></option>
  </datalist>
  <datalist id="contactList">
    <option value="青柳"></option>
    <option value="主任"></option>
    <option value="横沢"></option>
    <option value="根岸"></option>
    <option value="川端"></option>
    <option value="飯塚"></option>
  </datalist>
  <datalist id="phoneList">
    <option value="049-573-1234"></option>
    <option value="090-3346-3470"></option>
    <option value="090-8642-8309"></option>
    <option value="090-2465-9291"></option>
    <option value="090-7255-0061"></option>
  </datalist>
  <datalist id="deliveryReqList">
    <option value="前橋"></option>
    <option value="現場直送"></option>
    <option value="直送"></option>
    <option value="白岡引き取り"></option>
    <option value="マルテー行田引き取り"></option>
  </datalist>
  <datalist id="makerList">
    <option value="エスケー"></option>
    <option value="ニッペ"></option>
    <option value="カンペ"></option>
    <option value="キクスイ"></option>
    <option value="大塚"></option>
    <option value="東日本"></option>
    <option value="日特"></option>
    <option value="フジワラ"></option>
    <option value="カモ井"></option>
    <option value="デルタ"></option>
    <option value="精和"></option>
    <option value="和信"></option>
    <option value="大阪ガス"></option>
  </datalist>
  <datalist id="detailList">
    <option value="生ネタサンプル"></option>
    <option value="塗板"></option>
  </datalist>
  <datalist id="unitList">
    <option value="缶"></option>
    <option value="本"></option>
    <option value="袋"></option>
    <option value="ケース"></option>
    <option value="枚"></option>
    <option value="パック"></option>
    <option value="個"></option>
    <option value="セット"></option>
    <option value="巻"></option>
    <option value="丁"></option>
  </datalist>
  <datalist id="remarkList">
    <option value="在庫"></option>
    <option value="追加"></option>
  </datalist>

  <script>
    const MAX_ITEMS = 6;
    const ITEM_FIELDS = ['メーカー', '品名', '詳細', '艶', '色', '容量', '数量', '単位', '摘要'];

    // 商品マスター（仮データ：GASやJSONから取得した配列に差し替え可能）
    const PRODUCT_MASTER = [
      { maker: 'エスケー', name: 'プレミアムシリコン', defaultUnit: '缶' },
      { maker: 'エスケー', name: 'プレミアム無機', defaultUnit: '缶' },
      { maker: 'エスケー', name: '水性SDサーフエポプレミアム', defaultUnit: '缶' },
      { maker: 'エスケー', name: '水性ミラクシーラーエコ', defaultUnit: '缶' },
      { maker: 'エスケー', name: 'マイルドシーラーEPO', defaultUnit: '缶' },
      { maker: 'エスケー', name: 'クリーンマイルドウレタン', defaultUnit: '缶' },
      { maker: 'ニッペ', name: 'ケンエースGⅡ', defaultUnit: '缶' },
      { maker: 'ニッペ', name: '水性ケンエース', defaultUnit: '缶' },
      { maker: 'ニッペ', name: '1液ファインウレタンU100', defaultUnit: '缶' },
      { maker: 'ニッペ', name: 'パーフェクトフィラー', defaultUnit: '缶' },
      { maker: 'ニッペ', name: 'ファインパーフェクトトップSi', defaultUnit: '缶' },
      { maker: 'カンペ', name: 'ビニデラックス300S', defaultUnit: '缶' },
      { maker: 'カンペ', name: '1液MレタンHG', defaultUnit: '缶' },
      { maker: 'カンペ', name: 'ダイナミックMUKI', defaultUnit: '缶' },
      { maker: 'カンペ', name: 'ダイナミックフィラー', defaultUnit: '缶' },
      { maker: 'キクスイ', name: 'ビュートップEP', defaultUnit: '缶' },
      { maker: 'キクスイ', name: 'ロイヤルシリコン', defaultUnit: '缶' },
      { maker: '大塚', name: '無印目地刷毛油性筋 10号', defaultUnit: '袋' },
      { maker: '大塚', name: 'ミニマイクロEight 3インチ13㎜', defaultUnit: 'パック' },
      { maker: 'フジワラ', name: 'ニューアールダンテKISO', defaultUnit: '缶' },
      { maker: '大阪ガス', name: 'キシラデコール', defaultUnit: '缶' },
      { maker: 'デルタ', name: 'SANラッカーシンナー', defaultUnit: '缶' }
    ];

    // 受注履歴サンプル（新しい順になるよう並べる。本番は受注入力シートから生成）
    const ORDER_HISTORY = [
      { maker: 'エスケー', name: 'プレミアムシリコン', gloss: '5F', color: 'SR-178', size: '15kg', unit: '缶' },
      { maker: 'エスケー', name: 'プレミアムシリコン', gloss: '5F', color: '25-65B', size: '15kg', unit: '缶' },
      { maker: 'エスケー', name: '水性SDサーフエポプレミアム', gloss: '', color: '', size: '15kg', unit: '缶' },
      { maker: 'エスケー', name: 'マイルドシーラーEPO', gloss: '', color: 'クリヤー', size: '14ks', unit: '缶' },
      { maker: 'ニッペ', name: 'ケンエースGⅡ', gloss: '', color: 'ND-102', size: '16kg', unit: '缶' },
      { maker: 'ニッペ', name: 'ケンエースGⅡ', gloss: '', color: 'N-95', size: '16kg', unit: '缶' },
      { maker: 'ニッペ', name: '1液ファインウレタンU100', gloss: '5F', color: 'ND-104', size: '15kg', unit: '缶' },
      { maker: 'カンペ', name: '1液MレタンHG', gloss: '', color: '25-92B', size: '3kg', unit: '缶' },
      { maker: 'カンペ', name: 'ダイナミックMUKI', gloss: '', color: '25-90B', size: '15kg', unit: '缶' },
      { maker: 'キクスイ', name: 'ビュートップEP', gloss: '', color: '25-85B', size: '200g', unit: '缶' },
      { maker: '大塚', name: '無印目地刷毛油性筋 10号', gloss: '', color: '', size: '', unit: '袋' },
      { maker: 'フジワラ', name: 'ニューアールダンテKISO', gloss: '', color: 'No.2', size: '20×30', unit: '枚' },
      { maker: '大阪ガス', name: 'キシラデコール', gloss: '', color: '#102ピニー', size: '16L', unit: '缶' }
    ];

    const itemsContainer = document.getElementById('itemsContainer');
    const addItemBtn = document.getElementById('addItemBtn');
    const previewBtn = document.getElementById('previewBtn');
    const clearBasicBtn = document.getElementById('clearBasicBtn');
    const jsonPreview = document.getElementById('jsonPreview');
    const statusText = document.getElementById('statusText');
    const orderForm = document.getElementById('orderForm');

    function uniqueValues(arr) {
      return Array.from(new Set(arr.filter((v) => String(v || '').trim() !== '')));
    }

    function setDatalistOptions(datalistEl, values) {
      datalistEl.innerHTML = '';
      uniqueValues(values).forEach((val) => {
        const opt = document.createElement('option');
        opt.value = val;
        datalistEl.appendChild(opt);
      });
    }

    // メーカー選択時：商品マスターから品名を絞り込み、履歴から直近のメーカー/品名を初期値にセット
    function applyMakerFilter(card, autoFillLatestProduct = true) {
      const idx = card.dataset.index;
      const makerInput = card.querySelector('[data-field="メーカー"]');
      const nameInput = card.querySelector('[data-field="品名"]');
      const nameList = card.querySelector(`#itemNameList-${idx}`);
      const maker = makerInput.value.trim();

      const masterNames = maker
        ? PRODUCT_MASTER.filter((p) => p.maker === maker).map((p) => p.name)
        : PRODUCT_MASTER.map((p) => p.name);
      const historyNames = maker
        ? ORDER_HISTORY.filter((h) => h.maker === maker).map((h) => h.name)
        : ORDER_HISTORY.map((h) => h.name);

      setDatalistOptions(nameList, [...masterNames, ...historyNames]);

      if (autoFillLatestProduct && maker) {
        const latestOrder = ORDER_HISTORY.find((h) => h.maker === maker);
        const latestMaster = PRODUCT_MASTER.find((p) => p.maker === maker);
        const nextName = (latestOrder && latestOrder.name) || (latestMaster && latestMaster.name) || '';
        if (nextName) {
          nameInput.value = nextName;
          applyProductHistoryFilter(card, true);
        }
      }
    }

    // 商品名選択時：履歴から艶・色・容量を絞り込み、前回値を初期値としてセット
    function applyProductHistoryFilter(card, autoFillLatestSpecs = true) {
      const idx = card.dataset.index;
      const makerInput = card.querySelector('[data-field="メーカー"]');
      const nameInput = card.querySelector('[data-field="品名"]');
      const detailInput = card.querySelector('[data-field="詳細"]');
      const glossInput = card.querySelector('[data-field="艶"]');
      const colorInput = card.querySelector('[data-field="色"]');
      const sizeInput = card.querySelector('[data-field="容量"]');
      const unitInput = card.querySelector('[data-field="単位"]');

      const glossList = card.querySelector(`#itemGlossList-${idx}`);
      const colorList = card.querySelector(`#itemColorList-${idx}`);
      const sizeList = card.querySelector(`#itemSizeList-${idx}`);

      const maker = makerInput.value.trim();
      const productName = nameInput.value.trim();

      const matchedHistory = ORDER_HISTORY.filter((h) => {
        const nameMatch = productName ? h.name === productName : true;
        const makerMatch = maker ? h.maker === maker : true;
        return nameMatch && makerMatch;
      });

      const sourceRows = matchedHistory.length > 0
        ? matchedHistory
        : (productName ? ORDER_HISTORY.filter((h) => h.name === productName) : ORDER_HISTORY);

      setDatalistOptions(glossList, sourceRows.map((r) => r.gloss));
      setDatalistOptions(colorList, sourceRows.map((r) => r.color));
      setDatalistOptions(sizeList, sourceRows.map((r) => r.size));

      if (autoFillLatestSpecs && productName) {
        const latest = sourceRows[0];
        if (latest) {
          glossInput.value = latest.gloss || '';
          colorInput.value = latest.color || '';
          sizeInput.value = latest.size || '';
          if (latest.unit) {
            unitInput.value = latest.unit;
          }
        }
        const masterItem = PRODUCT_MASTER.find(
          (p) => p.name === productName && (!maker || p.maker === maker)
        );
        if (masterItem && masterItem.defaultUnit && !unitInput.value) {
          unitInput.value = masterItem.defaultUnit;
        }
        // 塗板や生ネタサンプルの案内用（必要時のみ手入力・datalistから選択）
        if (!detailInput.value && productName.includes('ダンテ')) {
          detailInput.placeholder = '例：塗板 / 生ネタサンプル';
        }
      }
    }

    function createItemCard(index, initial = {}) {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.index = index;

      card.innerHTML = `
        <div class="item-top">
          <span class="item-badge">明細 ${index}</span>
          <div class="item-actions">
            <button type="button" class="btn-ghost copy-item-btn">複製</button>
            ${index > 1 ? `<button type="button" class="btn-danger remove-item-btn">削除</button>` : ''}
          </div>
        </div>

        <div class="item-row-upper">
          <div class="field">
            <label>メーカー${index}</label>
            <input type="text" data-field="メーカー" list="makerList" placeholder="例：エスケー" />
          </div>
          <div class="field">
            <label>品名${index}</label>
            <input type="text" data-field="品名" list="itemNameList-${index}" placeholder="メーカー選択で絞り込み" />
            <datalist id="itemNameList-${index}"></datalist>
          </div>
          <div class="field">
            <label>詳細${index}</label>
            <input type="text" data-field="詳細" list="detailList" placeholder="生ネタサンプル / 塗板 など" />
          </div>
          <div class="field">
            <label>艶${index}</label>
            <input type="text" data-field="艶" list="itemGlossList-${index}" placeholder="履歴から絞り込み" />
            <datalist id="itemGlossList-${index}"></datalist>
          </div>
          <div class="field">
            <label>色${index}</label>
            <input type="text" data-field="色" list="itemColorList-${index}" placeholder="履歴から絞り込み" />
            <datalist id="itemColorList-${index}"></datalist>
          </div>
        </div>

        <div class="item-row-lower">
          <div class="field">
            <label>容量${index}</label>
            <input type="text" data-field="容量" list="itemSizeList-${index}" placeholder="履歴から絞り込み" />
            <datalist id="itemSizeList-${index}"></datalist>
          </div>
          <div class="field">
            <label>数量${index}</label>
            <input type="number" step="any" data-field="数量" placeholder="1" />
          </div>
          <div class="field">
            <label>単位${index}</label>
            <input type="text" data-field="単位" list="unitList" placeholder="例：缶" />
          </div>
          <div class="field">
            <label>摘要${index}</label>
            <input type="text" data-field="摘要" list="remarkList" placeholder="例：在庫 / 追加" />
          </div>
        </div>
      `;

      const makerInput = card.querySelector('[data-field="メーカー"]');
      const nameInput = card.querySelector('[data-field="品名"]');

      ITEM_FIELDS.forEach((field) => {
        const input = card.querySelector(`[data-field="${field}"]`);
        if (input && initial[field] !== undefined) {
          input.value = initial[field];
        }
      });

      applyMakerFilter(card, false);
      applyProductHistoryFilter(card, false);

      makerInput.addEventListener('change', () => {
        applyMakerFilter(card, true);
        updatePreview();
        statusText.textContent = `明細${card.dataset.index}：メーカーに合わせて商品マスターを絞り込みました`;
      });

      nameInput.addEventListener('change', () => {
        applyProductHistoryFilter(card, true);
        updatePreview();
        statusText.textContent = `明細${card.dataset.index}：履歴から艶・色・容量を絞り込み、前回値を反映しました`;
      });

      card.querySelector('.copy-item-btn').addEventListener('click', () => {
        const currentCards = itemsContainer.querySelectorAll('.item-card').length;
        if (currentCards >= MAX_ITEMS) {
          statusText.textContent = `明細は最大${MAX_ITEMS}行までです`;
          return;
        }
        const values = {};
        ITEM_FIELDS.forEach((field) => {
          values[field] = card.querySelector(`[data-field="${field}"]`).value;
        });
        itemsContainer.appendChild(createItemCard(currentCards + 1, values));
        renumberItems();
        updatePreview();
      });

      const removeBtn = card.querySelector('.remove-item-btn');
      if (removeBtn) {
        removeBtn.addEventListener('click', () => {
          card.remove();
          renumberItems();
          updatePreview();
        });
      }

      return card;
    }

    function renumberItems() {
      const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));
      cards.forEach((card, idx) => {
        const num = idx + 1;
        card.dataset.index = num;
        card.querySelector('.item-badge').textContent = `明細 ${num}`;
        card.querySelectorAll('label').forEach((lbl) => {
          const base = lbl.textContent.replace(/[1-6]$/, '');
          lbl.textContent = `${base}${num}`;
        });

        const nameInput = card.querySelector('[data-field="品名"]');
        const nameList = card.querySelector('datalist[id^="itemNameList-"]');
        if (nameInput && nameList) {
          nameList.id = `itemNameList-${num}`;
          nameInput.setAttribute('list', nameList.id);
        }
        const glossInput = card.querySelector('[data-field="艶"]');
        const glossList = card.querySelector('datalist[id^="itemGlossList-"]');
        if (glossInput && glossList) {
          glossList.id = `itemGlossList-${num}`;
          glossInput.setAttribute('list', glossList.id);
        }
        const colorInput = card.querySelector('[data-field="色"]');
        const colorList = card.querySelector('datalist[id^="itemColorList-"]');
        if (colorInput && colorList) {
          colorList.id = `itemColorList-${num}`;
          colorInput.setAttribute('list', colorList.id);
        }
        const sizeInput = card.querySelector('[data-field="容量"]');
        const sizeList = card.querySelector('datalist[id^="itemSizeList-"]');
        if (sizeInput && sizeList) {
          sizeList.id = `itemSizeList-${num}`;
          sizeInput.setAttribute('list', sizeList.id);
        }

        const actions = card.querySelector('.item-actions');
        const hasRemove = Boolean(actions.querySelector('.remove-item-btn'));
        if (num > 1 && !hasRemove) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-danger remove-item-btn';
          btn.textContent = '削除';
          btn.addEventListener('click', () => {
            card.remove();
            renumberItems();
            updatePreview();
          });
          actions.appendChild(btn);
        } else if (num === 1 && hasRemove) {
          actions.querySelector('.remove-item-btn').remove();
        }
      });
      addItemBtn.disabled = cards.length >= MAX_ITEMS;
    }

    function addItemRow(initial = {}) {
      const currentCards = itemsContainer.querySelectorAll('.item-card').length;
      if (currentCards >= MAX_ITEMS) return;
      itemsContainer.appendChild(createItemCard(currentCards + 1, initial));
      renumberItems();
    }

    function buildPayload() {
      const payload = {};
      const formData = new FormData(orderForm);
      for (const [key, value] of formData.entries()) {
        payload[key] = value;
      }
      if (payload['希望納期']) {
        payload['希望納期'] = payload['希望納期'].replace(/-/g, '/');
      }

      const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));
      for (let i = 1; i <= MAX_ITEMS; i++) {
        const card = cards[i - 1];
        ITEM_FIELDS.forEach((field) => {
          const input = card ? card.querySelector(`[data-field="${field}"]`) : null;
          payload[`${field}${i}`] = input ? input.value : '';
        });
      }
      return payload;
    }

    function updatePreview() {
      jsonPreview.textContent = JSON.stringify(buildPayload(), null, 2);
    }

    function formatDateYmd(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    document.querySelectorAll('.chip[data-preset]').forEach((chip) => {
      chip.addEventListener('click', () => {
        const preset = chip.dataset.preset;
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        if (preset === 'stock') {
          document.getElementById('userName').value = '在庫';
          document.getElementById('destination').value = '貴社';
        } else if (preset === 'store') {
          document.getElementById('destination').value = '店渡し';
          document.getElementById('deliveryDate').value = formatDateYmd(today);
        } else if (preset === 'site') {
          document.getElementById('destination').value = '現場';
        } else if (preset === 'direct') {
          document.getElementById('destination').value = '直送';
        } else if (preset === 'tomorrow-am') {
          document.getElementById('deliveryDate').value = formatDateYmd(tomorrow);
          document.getElementById('deliveryTime').value = 'AM';
        }
        updatePreview();
        statusText.textContent = `プリセット「${chip.textContent}」を反映しました`;
      });
    });

    clearBasicBtn.addEventListener('click', () => {
      ['userName', 'contactPerson', 'phone', 'siteName', 'deliveryDate', 'deliveryRequest', 'orderSource', 'siteAddress', 'etcNote'].forEach((id) => {
        document.getElementById(id).value = '';
      });
      document.getElementById('deliveryTime').value = '';
      document.getElementById('destination').value = '貴社';
      updatePreview();
      statusText.textContent = '基本情報をクリアしました';
    });

    addItemBtn.addEventListener('click', () => {
      addItemRow({ 単位: '缶' });
      updatePreview();
    });

    previewBtn.addEventListener('click', () => {
      updatePreview();
      statusText.textContent = 'JSONプレビューを更新しました';
    });

    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = buildPayload();
      jsonPreview.textContent = JSON.stringify(data, null, 2);

      const gasUrl = document.getElementById('gasUrl').value.trim();
      if (!gasUrl) {
        statusText.textContent = 'GAS URL未入力のため、画面プレビューのみ更新しました';
        return;
      }

      statusText.textContent = '送信中...';
      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        statusText.textContent = '送信リクエストを実行しました（シート反映を確認してください）';
      } catch (err) {
        statusText.textContent = `送信エラー: ${err.message}`;
      }
    });

    addItemRow({ 単位: '缶' });
    updatePreview();
  </script>
</body>
</html>
