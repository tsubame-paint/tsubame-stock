<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>受注フォーム（GAS連動・v5）</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --danger: #dc2626;
      --chip-bg: #f8fafc;
      --chip-border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
    }
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .sub { color: var(--muted); font-size: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: 700; color: #334155; }
    .input-clear-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .input-clear-wrap input,
    .input-clear-wrap select {
      padding-right: 30px;
    }
    .field-clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .field-clear-btn:hover {
      background: #fee2e2;
      color: var(--danger);
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: var(--primary);
    }
    textarea { min-height: 58px; resize: vertical; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }
    .chips-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px; }
    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: #1e293b;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { background: #eff6ff; border-color: #93c5fd; color: var(--primary); }
    .item-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .item-badge { font-weight: 700; font-size: 13px; color: #0f172a; }
    .item-actions { display: flex; gap: 6px; align-items: center; }
    .item-row-upper {
      display: grid;
      grid-template-columns: 1.1fr 1.6fr 1.1fr 0.9fr 1.2fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .item-row-lower {
      display: grid;
      grid-template-columns: 1fr 0.8fr 0.8fr 1.4fr;
      gap: 8px;
    }
    @media (max-width: 860px) {
      .item-row-upper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .item-row-lower { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .item-row-upper, .item-row-lower { grid-template-columns: 1fr; }
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); color: #334155; padding: 4px 9px; font-size: 12px; }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-danger { background: #fee2e2; color: var(--danger); padding: 4px 9px; font-size: 12px; }
    .btn-danger:hover { background: #fecaca; }
    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>受注フォーム（GAS連動・v5）</h1>
        <div class="sub">端末ごとの発行者記憶・発行者マスター自動保管・候補選択と自由入力を1欄に集約</div>
      </div>
    </div>

    <form id="orderForm">
      <!-- 1. 基本・納品情報 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">1. 基本・納品情報</h2>
          <div class="btn-group">
            <button type="button" class="btn-ghost" id="clearBasicBtn">基本情報をクリア</button>
          </div>
        </div>

        <div class="grid-4">
          <div class="field">
            <label for="issuer">発行者（端末ごとに記憶・自動保管）</label>
            <div class="input-clear-wrap">
              <input id="issuer" name="発行者" type="text" list="issuerList" placeholder="選択または入力（例：今井 / 佐々木）" />
              <button type="button" class="field-clear-btn" data-clear-target="issuer" data-label="発行者" title="発行者を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="userName">ユーザー名（選択・入力）</label>
            <div class="input-clear-wrap">
              <input id="userName" name="ユーザー名" type="text" list="userList" placeholder="選択または入力（例：中澤塗装㈱ / ㈲アベル）" required />
              <button type="button" class="field-clear-btn" data-clear-target="userName" data-label="ユーザー名" title="ユーザー名を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="contactPerson">担当者（選択・空白・入力）</label>
            <div class="input-clear-wrap">
              <input id="contactPerson" name="担当者" type="text" list="contactList" placeholder="選択・空白・手入力" />
              <button type="button" class="field-clear-btn" data-clear-target="contactPerson" data-label="担当者" title="担当者を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="phone">電話番号</label>
            <div class="input-clear-wrap">
              <input id="phone" name="電話番号" type="tel" list="phoneList" placeholder="顧客マスター連動または手入力" />
              <button type="button" class="field-clear-btn" data-clear-target="phone" data-label="電話番号" title="電話番号を削除">×</button>
            </div>
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="field">
            <label for="siteName">現場名（選択・入力）</label>
            <div class="input-clear-wrap">
              <input id="siteName" name="現場名" type="text" list="siteNameList" placeholder="選択または入力" />
              <button type="button" class="field-clear-btn" data-clear-target="siteName" data-label="現場名" title="現場名を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="deliveryDate">希望納期</label>
            <div class="input-clear-wrap">
              <input id="deliveryDate" name="希望納期" type="date" />
              <button type="button" class="field-clear-btn" data-clear-target="deliveryDate" data-label="希望納期" title="希望納期を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="deliveryTime">納期時間帯</label>
            <div class="input-clear-wrap">
              <select id="deliveryTime" name="納期時間帯">
                <option value="">指定なし</option>
                <option value="AM">AM</option>
                <option value="PM">PM</option>
                <option value="至急">至急</option>
              </select>
              <button type="button" class="field-clear-btn" data-clear-target="deliveryTime" data-label="納期時間帯" title="納期時間帯を削除">×</button>
            </div>
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="field">
            <label for="destination">届け先</label>
            <div class="input-clear-wrap">
              <select id="destination" name="届け先">
                <option value="貴社">貴社</option>
                <option value="現場">現場</option>
                <option value="店渡し">店渡し</option>
                <option value="直送">直送</option>
                <option value="現場直送">現場直送</option>
                <option value="その他">その他</option>
              </select>
              <button type="button" class="field-clear-btn" data-clear-target="destination" data-label="届け先" title="届け先を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="deliveryRequest">配達依頼（選択・入力）</label>
            <div class="input-clear-wrap">
              <input id="deliveryRequest" name="配達依頼" type="text" list="deliveryReqList" placeholder="選択または入力" />
              <button type="button" class="field-clear-btn" data-clear-target="deliveryRequest" data-label="配達依頼" title="配達依頼を削除">×</button>
            </div>
          </div>
          <div class="field">
            <label for="orderSource">発注先（選択・入力）</label>
            <div class="input-clear-wrap">
              <input id="orderSource" name="発注先" type="text" list="orderSourceList" placeholder="選択または入力" />
              <button type="button" class="field-clear-btn" data-clear-target="orderSource" data-label="発注先" title="発注先を削除">×</button>
            </div>
          </div>
        </div>

        <div class="field" style="margin-top: 10px;">
          <label for="siteAddress">現場住所（選択・入力）</label>
          <div class="input-clear-wrap">
            <input id="siteAddress" name="現場住所" type="text" list="siteAddressList" placeholder="選択または入力（例：〒272-0133 千葉県市川市行徳駅前2丁目11−2）" />
            <button type="button" class="field-clear-btn" data-clear-target="siteAddress" data-label="現場住所" title="現場住所を削除">×</button>
          </div>
        </div>

        <div class="field" style="margin-top: 10px;">
          <label for="etcNote">etc.（備考・追加／引き取り／納品条件）</label>
          <textarea id="etcNote" name="etc." placeholder="例：追加分、引き取り予定、納品条件など"></textarea>
        </div>

        <div class="chips">
          <span class="chips-label">クイック入力:</span>
          <button type="button" class="chip" data-preset="stock">在庫（貴社）</button>
          <button type="button" class="chip" data-preset="store">店渡し（本日）</button>
          <button type="button" class="chip" data-preset="site">現場納品</button>
          <button type="button" class="chip" data-preset="direct">直送</button>
          <button type="button" class="chip" data-preset="tomorrow-am">明日AM</button>
        </div>
      </div>

      <!-- 2. 受注明細 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">2. 受注明細（1〜6行）</h2>
          <div class="btn-group">
            <button type="button" class="btn-secondary" id="addItemBtn">＋ 明細を追加</button>
          </div>
        </div>
        <div id="itemsContainer"></div>
      </div>

      <!-- 3. 送信 -->
      <div class="card">
        <div class="footer-bar">
          <button type="submit" class="btn-primary" id="submitBtn">フォーム送信</button>
          <span id="statusText" class="sub">準備完了</span>
        </div>
      </div>
    </form>
  </div>

  <!-- 共通サジェスト -->
  <datalist id="issuerList">
    <option value="今井"></option>
    <option value="佐々木"></option>
  </datalist>
  <datalist id="userList"></datalist>
  <datalist id="contactList"></datalist>
  <datalist id="phoneList"></datalist>
  <datalist id="siteNameList"></datalist>
  <datalist id="siteAddressList"></datalist>
  <datalist id="deliveryReqList"></datalist>
  <datalist id="orderSourceList"></datalist>
  <datalist id="makerList"></datalist>
  <datalist id="detailList">
    <option value="生ネタサンプル"></option>
    <option value="塗板"></option>
  </datalist>
  <datalist id="unitList">
    <option value="缶"></option>
    <option value="本"></option>
    <option value="袋"></option>
    <option value="ケース"></option>
    <option value="枚"></option>
    <option value="パック"></option>
    <option value="個"></option>
    <option value="セット"></option>
    <option value="巻"></option>
    <option value="丁"></option>
  </datalist>
  <datalist id="remarkList">
    <option value="在庫"></option>
    <option value="追加"></option>
  </datalist>

  <script>
    const MAX_ITEMS = 6;
    const ITEM_FIELDS = ['メーカー', '品名', '詳細', '艶', '色', '容量', '数量', '単位', '摘要'];
    const STORAGE_KEY_GAS_URL = 'tsubame_order_gas_url_v1';
    const STORAGE_KEY_DEVICE_ISSUER = 'tsubame_device_issuer_v1';
    const STORAGE_KEY_DEVICE_ID = 'tsubame_device_id_v1';
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzm90lWQziIqNVPqeThucWMkRm84HJ-hZCbjDXOyR8hxIWueGwEJViiPR28qNLm9Q/exec';

    const FALLBACK_DATA = {
      ok: true,
      updatedAt: 'オフライン初期値',
      makers: ['エスケー', 'ニッペ', 'カンペ', 'キクスイ', '大塚', 'フジワラ', '大阪ガス'],

      productsByMaker: {

      },
      historyByProduct: {
        'プレミアムシリコン': {
          makers: ['エスケー'],
          defaultUnit: '缶',
          options: { gloss: ['5F', '艶有'], color: ['SR-178', '25-65B'], size: ['15kg', '16ks'], unit: ['缶'] },
          latest: { maker: 'エスケー', gloss: '5F', color: 'SR-178', size: '15kg', unit: '缶', detail: '' }
        },
        'ケンエースGⅡ': {
          makers: ['ニッペ'],
          defaultUnit: '缶',

        }
      },
      rankedUsers: ['㈲アベル', 'ケイスタイル㈱', '中澤塗装㈱', '川村塗装', '在庫'],
      customerOrders: [
        {
          userName: '㈲アベル',
          contactPerson: '根岸',
          phone: '090-2524-8332',
          siteName: 'サンドラッグ行徳店',
          siteAddress: '〒272-0133 千葉県市川市行徳駅前2丁目11−2',
          destination: '現場直送',
          deliveryRequest: ''
        },
        {
          userName: 'ケイスタイル㈱',
          contactPerson: '主任',
          phone: '090-7171-5960',
          siteName: '羽生城沼住宅',
          siteAddress: '〒348-0052 埼玉県羽生市東7丁目15−8 県-78-1',
          destination: '現場',
          deliveryRequest: ''
        },
        {

    };

    let catalogState = {
      makers: [...FALLBACK_DATA.makers],
      issuers: [...FALLBACK_DATA.issuers],
      deliveryRequests: [...FALLBACK_DATA.deliveryRequests],
      orderSources: [...FALLBACK_DATA.orderSources],
      productsByMaker: { ...FALLBACK_DATA.productsByMaker },
      historyByProduct: { ...FALLBACK_DATA.historyByProduct },
      rankedUsers: [...FALLBACK_DATA.rankedUsers],
      customerOrders: [...FALLBACK_DATA.customerOrders],
      contactsByUser: { ...FALLBACK_DATA.contactsByUser }
    };

    let lastSyncedIssuerKey = '';

    const linkCancelled = {
      phone: false,
      destination: false
    };

    function getOrCreateDeviceId() {
      let id = '';
      try {
        id = (localStorage.getItem(STORAGE_KEY_DEVICE_ID) || '').trim();
        if (!id) {
          id = 'dev-' + Math.random().toString(36).slice(2, 10);
          localStorage.setItem(STORAGE_KEY_DEVICE_ID, id);
        }
      } catch (e) {
        id = 'dev-temp';
      }
      return id;
    }

    function getGasUrl() {
      let savedUrl = '';
      try {
        savedUrl = (localStorage.getItem(STORAGE_KEY_GAS_URL) || '').trim();
      } catch (e) {
        savedUrl = '';
      }
      return savedUrl || DEFAULT_GAS_URL.trim();
    }

    const deviceId = getOrCreateDeviceId();

    const issuerInput = document.getElementById('issuer');
    const userNameInput = document.getElementById('userName');
    const contactListEl = document.getElementById('contactList');
    const contactPersonInput = document.getElementById('contactPerson');
    const phoneInput = document.getElementById('phone');
    const phoneListEl = document.getElementById('phoneList');
    const siteNameInput = document.getElementById('siteName');
    const siteNameListEl = document.getElementById('siteNameList');
    const siteAddressInput = document.getElementById('siteAddress');
    const siteAddressListEl = document.getElementById('siteAddressList');
    const destinationSelect = document.getElementById('destination');
    const deliveryRequestInput = document.getElementById('deliveryRequest');
    const deliveryReqListEl = document.getElementById('deliveryReqList');
    const orderSourceInput = document.getElementById('orderSource');
    const orderSourceListEl = document.getElementById('orderSourceList');

    const itemsContainer = document.getElementById('itemsContainer');
    const addItemBtn = document.getElementById('addItemBtn');
    const clearBasicBtn = document.getElementById('clearBasicBtn');
    const statusText = document.getElementById('statusText');
    const orderForm = document.getElementById('orderForm');

    function uniqueValues(arr) {
      return Array.from(new Set((arr || []).map((v) => String(v || '').trim()).filter(Boolean)));
    }

    function setDatalistOptions(datalistEl, values) {
      if (!datalistEl) return;
      datalistEl.innerHTML = '';
      uniqueValues(values).forEach((val) => {
        const opt = document.createElement('option');
        opt.value = val;
        datalistEl.appendChild(opt);
      });
    }

    function getAllUserCandidates() {
      const orders = catalogState.customerOrders || [];
      const ranked = uniqueValues(catalogState.rankedUsers || []);
      const masterUsers = uniqueValues(orders.map((o) => o.userName));
      return ranked.length > 0 ? uniqueValues([...ranked, ...masterUsers]) : masterUsers;
    }

    function getAllSiteAddressCandidates() {
      const orders = catalogState.customerOrders || [];
      const selectedUser = userNameInput.value.trim();
      const selectedSite = siteNameInput.value.trim();
      if (!selectedUser) {
        return uniqueValues(orders.map((o) => o.siteAddress));
      }
      const sameUserRows = orders.filter((o) => String(o.userName || '').trim() === selectedUser);
      const siteRows = selectedSite
        ? sameUserRows.filter((o) => String(o.siteName || '').trim() === selectedSite)
        : [];
      const preferred = siteRows.length > 0 ? siteRows : sameUserRows;
      return uniqueValues(
        preferred.map((r) => r.siteAddress)
          .concat(sameUserRows.map((r) => r.siteAddress))
          .concat(orders.map((o) => o.siteAddress))
      );
    }

    function getMasterContactEntries(selectedUser) {
      const user = String(selectedUser || '').trim();
      if (!user) return { names: [], hasBlank: false };

      const sameUserRows = (catalogState.customerOrders || []).filter(
        (o) => String(o.userName || '').trim() === user
      );

      let names = [];
      let hasBlank = false;

      if (catalogState.contactsByUser && Object.prototype.hasOwnProperty.call(catalogState.contactsByUser, user)) {
        const rawList = Array.isArray(catalogState.contactsByUser[user]) ? catalogState.contactsByUser[user] : [];
        rawList.forEach((item) => {
          const trimmed = String(item || '').trim();
          if (trimmed) {
            if (!names.includes(trimmed)) names.push(trimmed);
          } else {
            hasBlank = true;
          }
        });
      }

      sameUserRows.forEach((r) => {
        const trimmed = String(r.contactPerson || '').trim();
        if (trimmed) {
          if (!names.includes(trimmed)) names.push(trimmed);
        } else {
          hasBlank = true;
        }
      });

      return { names, hasBlank };
    }

    function syncContactDatalist(selectedUser) {
      const user = String(selectedUser || '').trim();
      if (!user) {
        const allContacts = uniqueValues(
          Object.values(catalogState.contactsByUser || {})
            .flat()
            .concat((catalogState.customerOrders || []).map((o) => o.contactPerson))
        );
        setDatalistOptions(contactListEl, allContacts);
        return;
      }
      const info = getMasterContactEntries(user);
      setDatalistOptions(contactListEl, info.names);
    }

    function getFilteredSiteNames(selectedUser, selectedContact = '') {
      const orders = catalogState.customerOrders || [];
      const user = String(selectedUser || '').trim();
      const contact = String(selectedContact || '').trim();
      if (!user) return uniqueValues(orders.map((o) => o.siteName));

      const sameUserRows = orders.filter((o) => String(o.userName || '').trim() === user);
      if (sameUserRows.length === 0) return [];

      const exactRows = contact
        ? sameUserRows.filter((o) => String(o.contactPerson || '').trim() === contact)
        : sameUserRows;

      if (exactRows.length > 0) {
        return uniqueValues(exactRows.map((r) => r.siteName).concat(sameUserRows.map((r) => r.siteName)));
      }

      return uniqueValues(sameUserRows.map((r) => r.siteName));
    }

    function refreshGlobalSuggestions() {
      setDatalistOptions(
        document.getElementById('issuerList'),
        uniqueValues([...FALLBACK_DATA.issuers, ...(catalogState.issuers || [])])
      );
      setDatalistOptions(document.getElementById('makerList'), catalogState.makers);
      setDatalistOptions(document.getElementById('userList'), getAllUserCandidates());
      syncContactDatalist(userNameInput.value.trim());
      setDatalistOptions(siteNameListEl, getFilteredSiteNames(userNameInput.value.trim(), contactPersonInput.value.trim()));
      setDatalistOptions(siteAddressListEl, getAllSiteAddressCandidates());
      setDatalistOptions(deliveryReqListEl, uniqueValues(catalogState.deliveryRequests || []));
      setDatalistOptions(orderSourceListEl, uniqueValues(catalogState.orderSources || []));
      syncScopedPhoneList();
    }

    function applyPhoneIfAllowed(nextPhone) {
      if (linkCancelled.phone) return;
      phoneInput.value = nextPhone || '';
    }

    function applyDestinationIfAllowed(nextDestination) {
      if (linkCancelled.destination || !nextDestination) return;
      const hasOption = Array.from(destinationSelect.options).some((opt) => opt.value === nextDestination);
      if (hasOption) {
        destinationSelect.value = nextDestination;
      }
    }

    function getScopedPhoneCandidates(selectedUser, selectedContact = '') {
      const user = String(selectedUser || '').trim();
      const contact = String(selectedContact || '').trim();
      if (!user) return [];

      const sameUserRows = (catalogState.customerOrders || []).filter(
        (o) => String(o.userName || '').trim() === user
      );
      if (sameUserRows.length === 0) return [];

      const exactContactRows = sameUserRows.filter(
        (o) => String(o.contactPerson || '').trim() === contact
      );
      const targetRows = exactContactRows.length > 0 ? exactContactRows : sameUserRows;
      return uniqueValues(targetRows.map((r) => r.phone));
    }

    function syncScopedPhoneList() {
      const selectedUser = userNameInput.value.trim();
      const selectedContact = contactPersonInput.value.trim();
      const scopedPhones = getScopedPhoneCandidates(selectedUser, selectedContact);
      setDatalistOptions(phoneListEl, scopedPhones);
      return scopedPhones;
    }

    function restoreIssuerIfMissing(data = {}) {
      let savedIssuer = '';
      try {
        savedIssuer = (localStorage.getItem(STORAGE_KEY_DEVICE_ISSUER) || '').trim();
      } catch (e) {
        savedIssuer = '';
      }

      const fromDeviceMap = (data.issuerByDeviceId && data.issuerByDeviceId[deviceId])
        ? String(data.issuerByDeviceId[deviceId]).trim()
        : '';
      const fromSuggested = data.suggestedIssuer ? String(data.suggestedIssuer).trim() : '';

      const recovered = savedIssuer || fromDeviceMap || fromSuggested || '';
      if (recovered) {
        if (!issuerInput.value.trim()) {
          issuerInput.value = recovered;
        }
        if (!savedIssuer) {
          try {
            localStorage.setItem(STORAGE_KEY_DEVICE_ISSUER, recovered);
          } catch (e) {}
        }
      }
    }

    async function syncIssuerToSheet(force = false) {
      const url = getGasUrl();
      const issuerVal = issuerInput.value.trim();
      if (!url || !issuerVal || !deviceId) return;

      const syncKey = `${url}::${deviceId}::${issuerVal}`;
      if (!force && lastSyncedIssuerKey === syncKey) return;

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'registerDevice',
            deviceId: deviceId,
            issuer: issuerVal,
            発行者: issuerVal,
            端末ID: deviceId
          })
        });
        lastSyncedIssuerKey = syncKey;
      } catch (e) {
        // 自動保管の通信失敗時は次回操作時に再試行
      }
    }

    function applyCustomerHistoryAutofill() {
      const selectedUser = userNameInput.value.trim();
      const orders = catalogState.customerOrders || [];

      if (!selectedUser) {
        contactPersonInput.value = '';
        siteNameInput.value = '';
        setDatalistOptions(phoneListEl, []);
        refreshGlobalSuggestions();
        return;
      }

      syncContactDatalist(selectedUser);
      const contactInfo = getMasterContactEntries(selectedUser);
      const defaultContact = contactInfo.names.length > 0 ? contactInfo.names[0] : '';
      contactPersonInput.value = defaultContact;

      const sameUserRows = orders.filter((o) => String(o.userName || '').trim() === selectedUser);
      const latestOrder = sameUserRows[0];

      siteNameInput.value = '';

      if (!latestOrder && contactInfo.names.length === 0 && !contactInfo.hasBlank) {
        setDatalistOptions(phoneListEl, []);
        refreshGlobalSuggestions();
        statusText.textContent = `「${selectedUser}」は顧客マスターに担当者が登録されていません（手入力可）`;
        return;
      }

      const activeContact = contactPersonInput.value.trim();
      const exactContactRows = sameUserRows.filter(
        (r) => String(r.contactPerson || '').trim() === activeContact
      );
      const basePool = exactContactRows.length > 0 ? exactContactRows : sameUserRows;

      const latestPhone = ((basePool.find((r) => r.phone) || {}).phone || (latestOrder && latestOrder.phone) || '');
      const latestSiteAddress = ((basePool.find((r) => r.siteAddress) || {}).siteAddress || (latestOrder && latestOrder.siteAddress) || '');

      applyPhoneIfAllowed(latestPhone);
      siteAddressInput.value = latestSiteAddress;

      const targetForMeta = basePool[0] || latestOrder || {};
      applyDestinationIfAllowed(targetForMeta.destination);
      if (targetForMeta.deliveryRequest !== undefined) {
        deliveryRequestInput.value = targetForMeta.deliveryRequest || '';
      }

      const siteCandidates = getFilteredSiteNames(selectedUser, activeContact);
      syncScopedPhoneList();
      refreshGlobalSuggestions();

      if (siteCandidates.length > 0) {
        statusText.textContent = `「${selectedUser}」の現場名候補（${siteCandidates.length}件）から選択または入力できます`;
      } else {
        statusText.textContent = `「${selectedUser}」の登録情報を反映しました（現場名は選択・入力可）`;
      }
    }

    function applyCustomerByContactAutofill() {
      const selectedUser = userNameInput.value.trim();
      const selectedContact = contactPersonInput.value.trim();

      if (!selectedUser) {
        setDatalistOptions(phoneListEl, []);
        refreshGlobalSuggestions();
        return;
      }

      const orders = catalogState.customerOrders || [];
      const sameUserRows = orders.filter((o) => String(o.userName || '').trim() === selectedUser);
      if (sameUserRows.length === 0) {
        setDatalistOptions(phoneListEl, []);
        refreshGlobalSuggestions();
        return;
      }

      const exactRows = sameUserRows.filter(
        (o) => String(o.contactPerson || '').trim() === selectedContact
      );

      const targetRow = exactRows[0] || sameUserRows[0];
      const pool = exactRows.length > 0 ? exactRows : sameUserRows;

      const nextPhone = targetRow.phone || (pool.find((r) => r.phone) || {}).phone || '';
      const nextSiteAddress = (pool.find((r) => r.siteAddress) || {}).siteAddress || targetRow.siteAddress || '';

      applyPhoneIfAllowed(nextPhone);
      siteAddressInput.value = nextSiteAddress;

      applyDestinationIfAllowed(targetRow.destination);
      if (targetRow.deliveryRequest !== undefined) {
        deliveryRequestInput.value = targetRow.deliveryRequest || '';
      }

      syncScopedPhoneList();
      refreshGlobalSuggestions();

      if (selectedContact && exactRows.length > 0) {
        statusText.textContent = `「${selectedUser} / ${selectedContact}」に一致する電話番号・現場住所を反映しました`;
      } else if (!selectedContact) {
        statusText.textContent = `「${selectedUser}」の担当者を空白に設定しました`;
      } else {
        statusText.textContent = `「${selectedContact}」の個別一致データがないため、「${selectedUser}」の登録情報を反映しました`;
      }
    }

    function applyAddressBySiteAutofill() {
      const selectedUser = userNameInput.value.trim();
      const selectedContact = contactPersonInput.value.trim();
      const selectedSite = siteNameInput.value.trim();
      if (!selectedUser) {
        refreshGlobalSuggestions();
        return;
      }

      const orders = catalogState.customerOrders || [];
      const sameUserRows = orders.filter((o) => String(o.userName || '').trim() === selectedUser);
      if (sameUserRows.length === 0) return;

      const siteRows = selectedSite
        ? sameUserRows.filter((o) => String(o.siteName || '').trim() === selectedSite)
        : [];

      const exactSiteAndContactRow = siteRows.find(
        (o) => String(o.contactPerson || '').trim() === selectedContact
      );

      const targetRow = exactSiteAndContactRow || siteRows[0] || sameUserRows[0];
      const pool = siteRows.length > 0 ? siteRows : sameUserRows;

      const nextAddress = targetRow.siteAddress || (pool.find((r) => r.siteAddress) || {}).siteAddress || '';
      if (nextAddress) {
        siteAddressInput.value = nextAddress;
      }

      if (selectedSite && !contactPersonInput.value.trim() && targetRow.contactPerson) {
        contactPersonInput.value = targetRow.contactPerson;
      }

      const nextPhone = targetRow.phone || (pool.find((r) => r.phone) || {}).phone || '';
      if (nextPhone) {
        applyPhoneIfAllowed(nextPhone);
      }

      const nextDestination = targetRow.destination || (pool.find((r) => r.destination) || {}).destination || '';
      applyDestinationIfAllowed(nextDestination);

      const nextDeliveryRequest = targetRow.deliveryRequest !== undefined
        ? targetRow.deliveryRequest
        : ((pool.find((r) => r.deliveryRequest) || {}).deliveryRequest || '');
      if (targetRow.deliveryRequest !== undefined || nextDeliveryRequest) {
        deliveryRequestInput.value = nextDeliveryRequest || '';
      }

      syncScopedPhoneList();
      refreshGlobalSuggestions();

      if (selectedSite && siteRows.length > 0) {
        statusText.textContent = `「${selectedUser} / ${selectedSite}」に紐づく現場住所・電話番号・届け先・配達依頼を反映しました`;
      } else if (selectedSite) {
        statusText.textContent = `「${selectedSite}」の登録情報がないため、「${selectedUser}」の登録情報を維持しました`;
      }
    }

    async function loadCatalogFromGas(showMessage = true) {
      const url = getGasUrl();
      if (!url) return;

      try {
        const separator = url.includes('?') ? '&' : '?';
        const requestUrl = `${url}${separator}deviceId=${encodeURIComponent(deviceId)}`;
        const res = await fetch(requestUrl, { method: 'GET' });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if (!data || !data.ok) {
          throw new Error((data && data.error) || 'データの取得に失敗しました');
        }

        const rawDeliveryRequests = Array.isArray(data.deliveryRequests)
          ? data.deliveryRequests
          : (Array.isArray(data.formAdminDeliveryRequests) ? data.formAdminDeliveryRequests : []);
        const cleanedDeliveryRequests = uniqueValues(rawDeliveryRequests);

        const rawOrderSources = Array.isArray(data.orderSources)
          ? data.orderSources
          : (Array.isArray(data.combinedViewOrderSources) ? data.combinedViewOrderSources : []);
        const cleanedOrderSources = uniqueValues(rawOrderSources);

        catalogState = {
          makers: uniqueValues(data.makers),
          issuers: uniqueValues(data.issuers),
          deliveryRequests: cleanedDeliveryRequests,
          orderSources: cleanedOrderSources,
          productsByMaker: data.productsByMaker || {},
          historyByProduct: data.historyByProduct || {},
          rankedUsers: Array.isArray(data.rankedUsers) ? uniqueValues(data.rankedUsers) : [],
          customerOrders: Array.isArray(data.customerOrders) ? data.customerOrders : [],
          contactsByUser: data.contactsByUser || {}
        };

        refreshGlobalSuggestions();
        restoreIssuerIfMissing(data);

        if (userNameInput.value.trim()) {
          applyCustomerHistoryAutofill();
        }

        Array.from(itemsContainer.querySelectorAll('.item-card')).forEach((card) => {
          applyMakerFilter(card, false);
          applyProductHistoryFilter(card, false);
        });

        if (issuerInput.value.trim()) {
          syncIssuerToSheet(false);
        }

        if (showMessage) {
          statusText.textContent = '顧客ランキング・商品マスター・顧客マスター・フォーム管理・受注履歴一覧を最新化しました';
        }
      } catch (err) {
        if (showMessage) {
          statusText.textContent = `読み込みエラー: ${err.message}`;
        }
      }
    }

    function applyMakerFilter(card, autoFillLatestProduct = true) {
      const idx = card.dataset.index;
      const makerInput = card.querySelector('[data-field="メーカー"]');
      const nameInput = card.querySelector('[data-field="品名"]');
      const nameList = card.querySelector(`#itemNameList-${idx}`);
      const maker = makerInput.value.trim();

      const candidates = maker
        ? (catalogState.productsByMaker[maker] || [])
        : Object.values(catalogState.productsByMaker).flat();

      setDatalistOptions(nameList, candidates);

      if (autoFillLatestProduct && maker) {
        const productCandidates = uniqueValues(candidates);
        const historyMatch = productCandidates.find((prodName) => {
          const hist = catalogState.historyByProduct[prodName];
          return hist && hist.latest && (!hist.latest.maker || hist.latest.maker === maker);
        });
        const nextName = historyMatch || productCandidates[0] || '';
        if (nextName) {
          nameInput.value = nextName;
          applyProductHistoryFilter(card, true);
        }
      }
    }

    function applyProductHistoryFilter(card, autoFillLatestSpecs = true) {
      const idx = card.dataset.index;
      const nameInput = card.querySelector('[data-field="品名"]');
      const glossInput = card.querySelector('[data-field="艶"]');
      const colorInput = card.querySelector('[data-field="色"]');
      const sizeInput = card.querySelector('[data-field="容量"]');
      const unitInput = card.querySelector('[data-field="単位"]');

      const glossList = card.querySelector(`#itemGlossList-${idx}`);
      const colorList = card.querySelector(`#itemColorList-${idx}`);
      const sizeList = card.querySelector(`#itemSizeList-${idx}`);

      const productName = nameInput.value.trim();
      const hist = productName ? catalogState.historyByProduct[productName] : null;

      if (hist && hist.options) {
        setDatalistOptions(glossList, hist.options.gloss || []);
        setDatalistOptions(colorList, hist.options.color || []);
        setDatalistOptions(sizeList, hist.options.size || []);
      } else {
        setDatalistOptions(glossList, []);
        setDatalistOptions(colorList, []);
        setDatalistOptions(sizeList, []);
      }

      if (autoFillLatestSpecs && hist && hist.latest) {
        glossInput.value = hist.latest.gloss || '';
        colorInput.value = hist.latest.color || '';
        sizeInput.value = hist.latest.size || '';
        if (hist.latest.unit || hist.defaultUnit) {
          unitInput.value = hist.latest.unit || hist.defaultUnit;
        }
      }
    }

        removeBtn.addEventListener('click', () => {
          card.remove();
          renumberItems();
        });
      }

      return card;
    }

    function renumberItems() {
      const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));
      cards.forEach((card, idx) => {
        const num = idx + 1;
        card.dataset.index = num;
        card.querySelector('.item-badge').textContent = `明細 ${num}`;
        card.querySelectorAll('label').forEach((lbl) => {
          const base = lbl.textContent.replace(/[1-6]$/, '');
          lbl.textContent = `${base}${num}`;
        });

        ['品名:itemNameList', '艶:itemGlossList', '色:itemColorList', '容量:itemSizeList'].forEach((pair) => {
          const [fieldName, prefix] = pair.split(':');
          const input = card.querySelector(`[data-field="${fieldName}"]`);
          const dl = card.querySelector(`datalist[id^="${prefix}-"]`);
          if (input && dl) {
            dl.id = `${prefix}-${num}`;
            input.setAttribute('list', dl.id);
          }
        });

        const actions = card.querySelector('.item-actions');
        const hasRemove = Boolean(actions.querySelector('.remove-item-btn'));
        if (num > 1 && !hasRemove) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-danger remove-item-btn';
          btn.textContent = '削除';
          btn.addEventListener('click', () => {
            card.remove();
            renumberItems();
          });
          actions.appendChild(btn);
        } else if (num === 1 && hasRemove) {
          actions.querySelector('.remove-item-btn').remove();
        }
      });
      addItemBtn.disabled = cards.length >= MAX_ITEMS;
    }

    function addItemRow(initial = {}) {
      const currentCards = itemsContainer.querySelectorAll('.item-card').length;
      if (currentCards >= MAX_ITEMS) return;
      itemsContainer.appendChild(createItemCard(currentCards + 1, initial));
      renumberItems();
    }

    function buildPayload() {
      const payload = {};
      const formData = new FormData(orderForm);
      for (const [key, value] of formData.entries()) {
        payload[key] = value;
      }
      payload['担当者'] = contactPersonInput.value.trim();
      if (payload['希望納期']) {
        payload['希望納期'] = payload['希望納期'].replace(/-/g, '/');
      }
      payload.deviceId = deviceId;

      const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));
      for (let i = 1; i <= MAX_ITEMS; i++) {
        const card = cards[i - 1];
        ITEM_FIELDS.forEach((field) => {
          const input = card ? card.querySelector(`[data-field="${field}"]`) : null;
          payload[`${field}${i}`] = input ? input.value : '';
        });
      }
      return payload;
    }

    function formatDateYmd(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    document.querySelectorAll('.field-clear-btn[data-clear-target]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.clearTarget;
        const labelText = btn.dataset.label || targetId;
        const el = document.getElementById(targetId);
        if (!el) return;

        if (targetId === 'phone') {
          linkCancelled.phone = true;
          el.value = '';
          const scopedPhones = syncScopedPhoneList();
          phoneInput.focus();
          if (scopedPhones.length > 0) {
            statusText.textContent = `「電話番号」をキャンセルしました（自動連動停止中・担当者の番号候補 ${scopedPhones.length}件を表示・手入力可）`;
          } else {
            statusText.textContent = '「電話番号」をキャンセルしました（自動連動停止中・手入力してください）';
          }
          return;
        }

        if (targetId === 'destination') {
          linkCancelled.destination = true;
          el.value = '';
          statusText.textContent = '「届け先」をキャンセルしました（自動連動停止中）';
          return;
        }

        el.value = '';
        el.dispatchEvent(new Event('change', { bubbles: true }));
        statusText.textContent = `「${labelText}」を削除しました`;
      });
    });

    phoneInput.addEventListener('change', () => {
      linkCancelled.phone = true;
    });

    destinationSelect.addEventListener('change', () => {
      linkCancelled.destination = true;
    });

    issuerInput.addEventListener('change', async () => {
      const val = issuerInput.value.trim();
      if (val) {
        try {
          localStorage.setItem(STORAGE_KEY_DEVICE_ISSUER, val);
        } catch (e) {}
        await syncIssuerToSheet(true);
        statusText.textContent = `この端末の発行者を「${val}」として保存し、発行者マスターへ保管しました`;
      } else {
        try {
          localStorage.removeItem(STORAGE_KEY_DEVICE_ISSUER);
        } catch (e) {}
        statusText.textContent = '端末の発行者記憶をクリアしました';
      }
    });

    userNameInput.addEventListener('change', () => {
      linkCancelled.phone = false;
      linkCancelled.destination = false;
      applyCustomerHistoryAutofill();
    });

    contactPersonInput.addEventListener('change', () => {
      applyCustomerByContactAutofill();
    });

    siteNameInput.addEventListener('change', () => {
      applyAddressBySiteAutofill();
    });

    document.querySelectorAll('.chip[data-preset]').forEach((chip) => {
      chip.addEventListener('click', () => {
        const preset = chip.dataset.preset;
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        if (preset === 'stock') {
          linkCancelled.phone = false;
          linkCancelled.destination = false;
          userNameInput.value = '在庫';
          destinationSelect.value = '貴社';
          linkCancelled.destination = true;
          applyCustomerHistoryAutofill();
        } else if (preset === 'store') {
          destinationSelect.value = '店渡し';
          linkCancelled.destination = true;
          document.getElementById('deliveryDate').value = formatDateYmd(today);
        } else if (preset === 'site') {
          destinationSelect.value = '現場';
          linkCancelled.destination = true;
        } else if (preset === 'direct') {
          destinationSelect.value = '直送';
          linkCancelled.destination = true;
        } else if (preset === 'tomorrow-am') {
          document.getElementById('deliveryDate').value = formatDateYmd(tomorrow);
          document.getElementById('deliveryTime').value = 'AM';
        }
        statusText.textContent = `プリセット「${chip.textContent}」を反映しました`;
      });
    });

    clearBasicBtn.addEventListener('click', () => {
      linkCancelled.phone = false;
      linkCancelled.destination = false;
      ['userName', 'contactPerson', 'phone', 'siteName', 'deliveryDate', 'deliveryRequest', 'orderSource', 'siteAddress', 'etcNote'].forEach((id) => {
        document.getElementById(id).value = '';
      });
      setDatalistOptions(phoneListEl, []);
      document.getElementById('deliveryTime').value = '';
      destinationSelect.value = '貴社';
      refreshGlobalSuggestions();
      statusText.textContent = '基本情報をクリアしました（端末の発行者設定は維持）';
    });

    addItemBtn.addEventListener('click', () => {
      addItemRow({ 数量: '1', 単位: '缶' });
    });

    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = buildPayload();
      const gasUrl = getGasUrl();
      if (!gasUrl) {
        statusText.textContent = '送信先URLが設定されていません';
        return;
      }

      statusText.textContent = '送信中...';
      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        lastSyncedIssuerKey = `${gasUrl}::${deviceId}::${issuerInput.value.trim()}`;
        statusText.textContent = '送信リクエストを実行しました（シート反映を確認してください）';
      } catch (err) {
        statusText.textContent = `送信エラー: ${err.message}`;
      }
    });

    restoreIssuerIfMissing({});
    refreshGlobalSuggestions();
    addItemRow({ 数量: '1', 単位: '缶' });
    if (getGasUrl()) {
      loadCatalogFromGas(false);
    }
  </script>
</body>
</html>
