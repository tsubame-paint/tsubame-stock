<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>受注フォーム（GAS連動・v5）</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --danger: #dc2626;
      --chip-bg: #f8fafc;
      --chip-border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
    }
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .sub { color: var(--muted); font-size: 12px; }
    .badge {
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .gas-bar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: end;
    }
    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .gas-bar { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: 700; color: #334155; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: var(--primary);
    }
    textarea { min-height: 58px; resize: vertical; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }
    .chips-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 2px; }
    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: #1e293b;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { background: #eff6ff; border-color: #93c5fd; color: var(--primary); }
    .item-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .item-badge { font-weight: 700; font-size: 13px; color: #0f172a; }
    .item-actions { display: flex; gap: 6px; align-items: center; }
    .item-row-upper {
      display: grid;
      grid-template-columns: 1.1fr 1.6fr 1.1fr 0.9fr 1.2fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .item-row-lower {
      display: grid;
      grid-template-columns: 1fr 0.8fr 0.8fr 1.4fr;
      gap: 8px;
    }
    @media (max-width: 860px) {
      .item-row-upper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .item-row-lower { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .item-row-upper, .item-row-lower { grid-template-columns: 1fr; }
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost { background: #fff; border: 1px solid var(--border); color: #334155; padding: 4px 9px; font-size: 12px; }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-danger { background: #fee2e2; color: var(--danger); padding: 4px 9px; font-size: 12px; }
    .btn-danger:hover { background: #fecaca; }
    .footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
      margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>受注フォーム（GAS連動・v5）</h1>
        <div class="sub">ユーザー名選択で直近履歴から担当者・電話番号・現場名・現場住所を自動入力＆明細絞り込み</div>
      </div>
      <span class="badge" id="syncBadge">未同期（フォールバック使用中）</span>
    </div>

    <!-- 0. GAS連携設定 -->
    <div class="card">
      <div class="card-head">
        <h2 class="card-title">0. GAS Webアプリ連携</h2>
        <span class="sub" id="lastUpdatedText">最終同期: -</span>
      </div>
      <div class="gas-bar">
        <div class="field">
          <label for="gasUrl">GAS WebアプリURL（doGet / doPost 共通）</label>
          <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/xxxxx/exec" />
        </div>
        <button type="button" class="btn-primary" id="loadGasBtn">マスター＆履歴を読み込み</button>
        <button type="button" class="btn-secondary" id="saveGasUrlBtn">URLを保存</button>
      </div>
    </div>

    <form id="orderForm">
      <!-- 1. 基本・納品情報 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">1. 基本・納品情報</h2>
          <div class="btn-group">
            <button type="button" class="btn-ghost" id="clearBasicBtn">基本情報をクリア</button>
          </div>
        </div>

        <div class="grid-4">
          <div class="field">
            <label for="issuer">発行者</label>
            <input id="issuer" name="発行者" type="text" list="issuerList" value="今井" />
          </div>
          <div class="field">
            <label for="userName">ユーザー名（得意先・在庫）</label>
            <input id="userName" name="ユーザー名" type="text" list="userList" placeholder="例：中澤塗装㈱ / ㈲アベル" required />
          </div>
          <div class="field">
            <label for="contactPerson">担当者</label>
            <input id="contactPerson" name="担当者" type="text" list="contactList" placeholder="例：根岸 / 主任" />
          </div>
          <div class="field">
            <label for="phone">電話番号</label>
            <input id="phone" name="電話番号" type="tel" list="phoneList" placeholder="例：090-2524-8332" />
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="field">
            <label for="siteName">現場名</label>
            <input id="siteName" name="現場名" type="text" list="siteNameList" placeholder="例：サンドラッグ行徳店" />
          </div>
          <div class="field">
            <label for="deliveryDate">希望納期</label>
            <input id="deliveryDate" name="希望納期" type="date" />
          </div>
          <div class="field">
            <label for="deliveryTime">納期時間帯</label>
            <select id="deliveryTime" name="納期時間帯">
              <option value="">指定なし</option>
              <option value="AM">AM</option>
              <option value="PM">PM</option>
              <option value="至急">至急</option>
            </select>
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="field">
            <label for="destination">届け先</label>
            <select id="destination" name="届け先">
              <option value="貴社">貴社</option>
              <option value="現場">現場</option>
              <option value="店渡し">店渡し</option>
              <option value="直送">直送</option>
              <option value="現場直送">現場直送</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="field">
            <label for="deliveryRequest">配達依頼</label>
            <input id="deliveryRequest" name="配達依頼" type="text" list="deliveryReqList" placeholder="例：前橋 / 現場直送 / 白岡引き取り" />
          </div>
          <div class="field">
            <label for="orderSource">発注先</label>
            <input id="orderSource" name="発注先" type="text" list="makerList" placeholder="例：メーカー名・仕入先" />
          </div>
        </div>

        <div class="field" style="margin-top: 10px;">
          <label for="siteAddress">現場住所</label>
          <input id="siteAddress" name="現場住所" type="text" list="siteAddressList" placeholder="例：〒272-0133 千葉県市川市行徳駅前2丁目11−2" />
        </div>

        <div class="field" style="margin-top: 10px;">
          <label for="etcNote">etc.（備考・追加／引き取り／納品条件）</label>
          <textarea id="etcNote" name="etc." placeholder="例：追加分、引き取り予定、納品条件など"></textarea>
        </div>

        <div class="chips">
          <span class="chips-label">クイック入力:</span>
          <button type="button" class="chip" data-preset="stock">在庫（貴社）</button>
          <button type="button" class="chip" data-preset="store">店渡し（本日）</button>
          <button type="button" class="chip" data-preset="site">現場納品</button>
          <button type="button" class="chip" data-preset="direct">直送</button>
          <button type="button" class="chip" data-preset="tomorrow-am">明日AM</button>
        </div>
      </div>

      <!-- 2. 受注明細 -->
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">2. 受注明細（1〜6行）</h2>
          <div class="btn-group">
            <button type="button" class="btn-secondary" id="addItemBtn">＋ 明細を追加</button>
          </div>
        </div>
        <div id="itemsContainer"></div>
      </div>

      <!-- 3. 送信・流し込み確認 -->
      <div class="card">
        <h2 class="card-title">3. 送信・流し込み確認</h2>
        <div class="footer-bar">
          <div class="btn-group">
            <button type="button" class="btn-secondary" id="previewBtn">JSONプレビュー更新</button>
            <button type="submit" class="btn-primary" id="submitBtn">フォーム送信</button>
          </div>
          <span id="statusText" class="sub">準備完了</span>
        </div>
        <pre id="jsonPreview">{}</pre>
      </div>
    </form>
  </div>

  <!-- 共通サジェスト -->
  <datalist id="issuerList">
    <option value="今井"></option>
    <option value="佐々木"></option>
  </datalist>
  <datalist id="userList"></datalist>
  <datalist id="contactList"></datalist>
  <datalist id="phoneList"></datalist>
  <datalist id="siteNameList"></datalist>
  <datalist id="siteAddressList"></datalist>
  <datalist id="deliveryReqList">
    <option value="前橋"></option>
    <option value="現場直送"></option>
    <option value="直送"></option>
    <option value="白岡引き取り"></option>
    <option value="マルテー行田引き取り"></option>
  </datalist>
  <datalist id="makerList"></datalist>
  <datalist id="detailList">
    <option value="生ネタサンプル"></option>
    <option value="塗板"></option>
  </datalist>
  <datalist id="unitList">
    <option value="缶"></option>
    <option value="本"></option>
    <option value="袋"></option>
    <option value="ケース"></option>
    <option value="枚"></option>
    <option value="パック"></option>
    <option value="個"></option>
    <option value="セット"></option>
    <option value="巻"></option>
    <option value="丁"></option>
  </datalist>
  <datalist id="remarkList">
    <option value="在庫"></option>
    <option value="追加"></option>
  </datalist>

  <script>
    const MAX_ITEMS = 6;
    const ITEM_FIELDS = ['メーカー', '品名', '詳細', '艶', '色', '容量', '数量', '単位', '摘要'];
    const STORAGE_KEY_GAS_URL = 'tsubame_order_gas_url_v1';

    // フォールバックデータ（新しい履歴が先頭になるよう並べる）
    const FALLBACK_DATA = {
      ok: true,
      updatedAt: 'オフライン初期値',
      makers: ['エスケー', 'ニッペ', 'カンペ', 'キクスイ', '大塚', 'フジワラ', '大阪ガス'],
      productsByMaker: {
        'エスケー': ['プレミアムシリコン', 'クリーンマイルドウレタン', 'マイルドシーラーEPO'],
        'ニッペ': ['ケンエースGⅡ', '水性ケンエース', '1液ファインウレタンU100'],
        'カンペ': ['1液MレタンHG', 'ビニデラックス300S', 'ダイナミックMUKI'],
        'キクスイ': ['ビュートップEP', 'ロイヤルシリコン'],
        '大塚': ['無印目地刷毛油性筋 10号'],
        'フジワラ': ['ニューアールダンテKISO'],
        '大阪ガス': ['キシラデコール']
      },
      historyByProduct: {
        'プレミアムシリコン': {
          makers: ['エスケー'],
          defaultUnit: '缶',
          options: { gloss: ['5F', '艶有'], color: ['SR-178', '25-65B'], size: ['15kg', '16ks'], unit: ['缶'] },
          latest: { maker: 'エスケー', gloss: '5F', color: 'SR-178', size: '15kg', unit: '缶', detail: '' }
        },
        'ケンエースGⅡ': {
          makers: ['ニッペ'],
          defaultUnit: '缶',
          options: { gloss: [], color: ['白', 'ND-102', 'N-95'], size: ['16kg', '4kg'], unit: ['缶'] },
          latest: { maker: 'ニッペ', gloss: '', color: '白', size: '16kg', unit: '缶', detail: '' }
        },
        '1液MレタンHG': {
          makers: ['カンペ'],
          defaultUnit: '缶',
          options: { gloss: [], color: ['赤さび', '黄', '25-92B'], size: ['3kg', '15kg'], unit: ['缶'] },
          latest: { maker: 'カンペ', gloss: '', color: '赤さび', size: '3kg', unit: '缶', detail: '' }
        }
      },
      customerOrders: [
        {
          userName: '㈲アベル',
          contactPerson: '根岸',
          phone: '090-2524-8332',
          siteName: 'サンドラッグ行徳店',
          siteAddress: '〒272-0133 千葉県市川市行徳駅前2丁目11−2',
          destination: '現場直送',
          deliveryRequest: ''
        },
        {
          userName: 'ケイスタイル㈱',
          contactPerson: '主任',
          phone: '090-7171-5960',
          siteName: '羽生城沼住宅',
          siteAddress: '〒348-0052 埼玉県羽生市東7丁目15−8 県-78-1',
          destination: '現場',
          deliveryRequest: ''
        },
        {
          userName: '中澤塗装㈱',
          contactPerson: '',
          phone: '049-573-1234',
          siteName: 'いろりの友特別老人ホーム',
          siteAddress: '',
          destination: '貴社',
          deliveryRequest: ''
        },
        {
          userName: '川村塗装',
          contactPerson: '',
          phone: '',
          siteName: '',
          siteAddress: '',
          destination: '貴社',
          deliveryRequest: ''
        },
        {
          userName: '在庫',
          contactPerson: '',
          phone: '',
          siteName: '',
          siteAddress: '',
          destination: '貴社',
          deliveryRequest: ''
        }
      ]
    };

    let catalogState = {
      makers: [...FALLBACK_DATA.makers],
      productsByMaker: { ...FALLBACK_DATA.productsByMaker },
      historyByProduct: { ...FALLBACK_DATA.historyByProduct },
      customerOrders: [...FALLBACK_DATA.customerOrders]
    };

    const gasUrlInput = document.getElementById('gasUrl');
    const loadGasBtn = document.getElementById('loadGasBtn');
    const saveGasUrlBtn = document.getElementById('saveGasUrlBtn');
    const syncBadge = document.getElementById('syncBadge');
    const lastUpdatedText = document.getElementById('lastUpdatedText');

    const userNameInput = document.getElementById('userName');
    const contactPersonInput = document.getElementById('contactPerson');
    const phoneInput = document.getElementById('phone');
    const siteNameInput = document.getElementById('siteName');
    const siteAddressInput = document.getElementById('siteAddress');
    const destinationSelect = document.getElementById('destination');
    const deliveryRequestInput = document.getElementById('deliveryRequest');

    const itemsContainer = document.getElementById('itemsContainer');
    const addItemBtn = document.getElementById('addItemBtn');
    const previewBtn = document.getElementById('previewBtn');
    const clearBasicBtn = document.getElementById('clearBasicBtn');
    const jsonPreview = document.getElementById('jsonPreview');
    const statusText = document.getElementById('statusText');
    const orderForm = document.getElementById('orderForm');

    function uniqueValues(arr) {
      return Array.from(new Set((arr || []).map((v) => String(v || '').trim()).filter(Boolean)));
    }

    function setDatalistOptions(datalistEl, values) {
      if (!datalistEl) return;
      datalistEl.innerHTML = '';
      uniqueValues(values).forEach((val) => {
        const opt = document.createElement('option');
        opt.value = val;
        datalistEl.appendChild(opt);
      });
    }

    function refreshGlobalSuggestions() {
      setDatalistOptions(document.getElementById('makerList'), catalogState.makers);

      const orders = catalogState.customerOrders || [];
      setDatalistOptions(document.getElementById('userList'), orders.map((o) => o.userName));
      setDatalistOptions(document.getElementById('contactList'), orders.map((o) => o.contactPerson));
      setDatalistOptions(document.getElementById('phoneList'), orders.map((o) => o.phone));
      setDatalistOptions(document.getElementById('siteNameList'), orders.map((o) => o.siteName));
      setDatalistOptions(document.getElementById('siteAddressList'), orders.map((o) => o.siteAddress));
    }

    // ユーザー名（得意先）選択時：直近の履歴から担当者・電話番号・現場名・現場住所を自動入力
    function applyCustomerHistoryAutofill() {
      const selectedUser = userNameInput.value.trim();
      if (!selectedUser) return;

      const orders = catalogState.customerOrders || [];
      const latestOrder = orders.find((o) => String(o.userName || '').trim() === selectedUser);

      if (!latestOrder) {
        statusText.textContent = `「${selectedUser}」の過去履歴が見つかりませんでした`;
        return;
      }

      // 同一得意先の過去行に部分的に入っている値があれば補完用として拾う
      const sameUserRows = orders.filter((o) => String(o.userName || '').trim() === selectedUser);
      const latestContact = latestOrder.contactPerson || (sameUserRows.find((r) => r.contactPerson) || {}).contactPerson || '';
      const latestPhone = latestOrder.phone || (sameUserRows.find((r) => r.phone) || {}).phone || '';
      const latestSiteName = latestOrder.siteName || (sameUserRows.find((r) => r.siteName) || {}).siteName || '';
      const latestSiteAddress = latestOrder.siteAddress || (sameUserRows.find((r) => r.siteAddress) || {}).siteAddress || '';

      contactPersonInput.value = latestContact;
      phoneInput.value = latestPhone;
      siteNameInput.value = latestSiteName;
      siteAddressInput.value = latestSiteAddress;

      if (latestOrder.destination) {
        const hasOption = Array.from(destinationSelect.options).some((opt) => opt.value === latestOrder.destination);
        if (hasOption) {
          destinationSelect.value = latestOrder.destination;
        }
      }
      if (latestOrder.deliveryRequest !== undefined) {
        deliveryRequestInput.value = latestOrder.deliveryRequest || '';
      }

      // 現場名・現場住所の候補リストをその得意先の履歴順に優先表示
      setDatalistOptions(
        document.getElementById('siteNameList'),
        uniqueValues(sameUserRows.map((r) => r.siteName).concat(orders.map((o) => o.siteName)))
      );
      setDatalistOptions(
        document.getElementById('siteAddressList'),
        uniqueValues(sameUserRows.map((r) => r.siteAddress).concat(orders.map((o) => o.siteAddress)))
      );

      updatePreview();
      statusText.textContent = `「${selectedUser}」の直近履歴（担当者・電話番号・現場名・現場住所）を反映しました`;
    }

    async function loadCatalogFromGas(showMessage = true) {
      const url = gasUrlInput.value.trim();
      if (!url) {
        if (showMessage) {
          statusText.textContent = 'GAS WebアプリURLを入力してください';
        }
        return;
      }

      if (showMessage) {
        statusText.textContent = 'GASから商品マスター・履歴を読み込み中...';
      }

      try {
        const res = await fetch(url, { method: 'GET' });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if (!data || !data.ok) {
          throw new Error((data && data.error) || 'データの取得に失敗しました');
        }

        catalogState = {
          makers: uniqueValues(data.makers),
          productsByMaker: data.productsByMaker || {},
          historyByProduct: data.historyByProduct || {},
          customerOrders: Array.isArray(data.customerOrders) ? data.customerOrders : []
        };

        refreshGlobalSuggestions();

        if (userNameInput.value.trim()) {
          applyCustomerHistoryAutofill();
        }

        Array.from(itemsContainer.querySelectorAll('.item-card')).forEach((card) => {
          applyMakerFilter(card, false);
          applyProductHistoryFilter(card, false);
        });

        syncBadge.textContent = 'GAS同期済み';
        syncBadge.style.background = '#dcfce7';
        syncBadge.style.color = '#166534';
        lastUpdatedText.textContent = `最終同期: ${data.updatedAt || new Date().toLocaleString('ja-JP')}`;
        if (showMessage) {
          statusText.textContent = '商品マスターと受注履歴を最新化しました';
        }
      } catch (err) {
        syncBadge.textContent = '同期エラー（フォールバック使用中）';
        syncBadge.style.background = '#fee2e2';
        syncBadge.style.color = '#991b1b';
        if (showMessage) {
          statusText.textContent = `読み込みエラー: ${err.message}`;
        }
      }
    }

    function applyMakerFilter(card, autoFillLatestProduct = true) {
      const idx = card.dataset.index;
      const makerInput = card.querySelector('[data-field="メーカー"]');
      const nameInput = card.querySelector('[data-field="品名"]');
      const nameList = card.querySelector(`#itemNameList-${idx}`);
      const maker = makerInput.value.trim();

      const candidates = maker
        ? (catalogState.productsByMaker[maker] || [])
        : Object.values(catalogState.productsByMaker).flat();

      setDatalistOptions(nameList, candidates);

      if (autoFillLatestProduct && maker) {
        const productCandidates = uniqueValues(candidates);
        const historyMatch = productCandidates.find((prodName) => {
          const hist = catalogState.historyByProduct[prodName];
          return hist && hist.latest && (!hist.latest.maker || hist.latest.maker === maker);
        });
        const nextName = historyMatch || productCandidates[0] || '';
        if (nextName) {
          nameInput.value = nextName;
          applyProductHistoryFilter(card, true);
        }
      }
    }

    function applyProductHistoryFilter(card, autoFillLatestSpecs = true) {
      const idx = card.dataset.index;
      const nameInput = card.querySelector('[data-field="品名"]');
      const glossInput = card.querySelector('[data-field="艶"]');
      const colorInput = card.querySelector('[data-field="色"]');
      const sizeInput = card.querySelector('[data-field="容量"]');
      const unitInput = card.querySelector('[data-field="単位"]');

      const glossList = card.querySelector(`#itemGlossList-${idx}`);
      const colorList = card.querySelector(`#itemColorList-${idx}`);
      const sizeList = card.querySelector(`#itemSizeList-${idx}`);

      const productName = nameInput.value.trim();
      const hist = productName ? catalogState.historyByProduct[productName] : null;

      if (hist && hist.options) {
        setDatalistOptions(glossList, hist.options.gloss || []);
        setDatalistOptions(colorList, hist.options.color || []);
        setDatalistOptions(sizeList, hist.options.size || []);
      } else {
        setDatalistOptions(glossList, []);
        setDatalistOptions(colorList, []);
        setDatalistOptions(sizeList, []);
      }

      if (autoFillLatestSpecs && hist && hist.latest) {
        glossInput.value = hist.latest.gloss || '';
        colorInput.value = hist.latest.color || '';
        sizeInput.value = hist.latest.size || '';
        if (hist.latest.unit || hist.defaultUnit) {
          unitInput.value = hist.latest.unit || hist.defaultUnit;
        }
      }
    }

    function createItemCard(index, initial = {}) {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.index = index;

      card.innerHTML = `
        <div class="item-top">
          <span class="item-badge">明細 ${index}</span>
          <div class="item-actions">
            <button type="button" class="btn-ghost copy-item-btn">複製</button>
            ${index > 1 ? `<button type="button" class="btn-danger remove-item-btn">削除</button>` : ''}
          </div>
        </div>

        <div class="item-row-upper">
          <div class="field">
            <label>メーカー${index}</label>
            <input type="text" data-field="メーカー" list="makerList" placeholder="例：エスケー" />
          </div>
          <div class="field">
            <label>品名${index}</label>
            <input type="text" data-field="品名" list="itemNameList-${index}" placeholder="メーカー選択で絞り込み" />
            <datalist id="itemNameList-${index}"></datalist>
          </div>
          <div class="field">
            <label>詳細${index}</label>
            <input type="text" data-field="詳細" list="detailList" placeholder="生ネタサンプル / 塗板 など" />
          </div>
          <div class="field">
            <label>艶${index}</label>
            <input type="text" data-field="艶" list="itemGlossList-${index}" placeholder="履歴から絞り込み" />
            <datalist id="itemGlossList-${index}"></datalist>
          </div>
          <div class="field">
            <label>色${index}</label>
            <input type="text" data-field="色" list="itemColorList-${index}" placeholder="履歴から絞り込み" />
            <datalist id="itemColorList-${index}"></datalist>
          </div>
        </div>

        <div class="item-row-lower">
          <div class="field">
            <label>容量${index}</label>
            <input type="text" data-field="容量" list="itemSizeList-${index}" placeholder="履歴から絞り込み" />
            <datalist id="itemSizeList-${index}"></datalist>
          </div>
          <div class="field">
            <label>数量${index}</label>
            <input type="number" step="any" data-field="数量" placeholder="1" />
          </div>
          <div class="field">
            <label>単位${index}</label>
            <input type="text" data-field="単位" list="unitList" placeholder="例：缶" />
          </div>
          <div class="field">
            <label>摘要${index}</label>
            <input type="text" data-field="摘要" list="remarkList" placeholder="例：在庫 / 追加" />
          </div>
        </div>
      `;

      const makerInput = card.querySelector('[data-field="メーカー"]');
      const nameInput = card.querySelector('[data-field="品名"]');

      ITEM_FIELDS.forEach((field) => {
        const input = card.querySelector(`[data-field="${field}"]`);
        if (input && initial[field] !== undefined) {
          input.value = initial[field];
        }
      });

      applyMakerFilter(card, false);
      applyProductHistoryFilter(card, false);

      makerInput.addEventListener('change', () => {
        applyMakerFilter(card, true);
        updatePreview();
        statusText.textContent = `明細${card.dataset.index}：メーカーに合わせて商品マスターを絞り込みました`;
      });

      nameInput.addEventListener('change', () => {
        applyProductHistoryFilter(card, true);
        updatePreview();
        statusText.textContent = `明細${card.dataset.index}：履歴から艶・色・容量を絞り込み、前回値を反映しました`;
      });

      card.querySelector('.copy-item-btn').addEventListener('click', () => {
        const currentCards = itemsContainer.querySelectorAll('.item-card').length;
        if (currentCards >= MAX_ITEMS) {
          statusText.textContent = `明細は最大${MAX_ITEMS}行までです`;
          return;
        }
        const values = {};
        ITEM_FIELDS.forEach((field) => {
          values[field] = card.querySelector(`[data-field="${field}"]`).value;
        });
        itemsContainer.appendChild(createItemCard(currentCards + 1, values));
        renumberItems();
        updatePreview();
      });

      const removeBtn = card.querySelector('.remove-item-btn');
      if (removeBtn) {
        removeBtn.addEventListener('click', () => {
          card.remove();
          renumberItems();
          updatePreview();
        });
      }

      return card;
    }

    function renumberItems() {
      const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));
      cards.forEach((card, idx) => {
        const num = idx + 1;
        card.dataset.index = num;
        card.querySelector('.item-badge').textContent = `明細 ${num}`;
        card.querySelectorAll('label').forEach((lbl) => {
          const base = lbl.textContent.replace(/[1-6]$/, '');
          lbl.textContent = `${base}${num}`;
        });

        ['品名:itemNameList', '艶:itemGlossList', '色:itemColorList', '容量:itemSizeList'].forEach((pair) => {
          const [fieldName, prefix] = pair.split(':');
          const input = card.querySelector(`[data-field="${fieldName}"]`);
          const dl = card.querySelector(`datalist[id^="${prefix}-"]`);
          if (input && dl) {
            dl.id = `${prefix}-${num}`;
            input.setAttribute('list', dl.id);
          }
        });

        const actions = card.querySelector('.item-actions');
        const hasRemove = Boolean(actions.querySelector('.remove-item-btn'));
        if (num > 1 && !hasRemove) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-danger remove-item-btn';
          btn.textContent = '削除';
          btn.addEventListener('click', () => {
            card.remove();
            renumberItems();
            updatePreview();
          });
          actions.appendChild(btn);
        } else if (num === 1 && hasRemove) {
          actions.querySelector('.remove-item-btn').remove();
        }
      });
      addItemBtn.disabled = cards.length >= MAX_ITEMS;
    }

    function addItemRow(initial = {}) {
      const currentCards = itemsContainer.querySelectorAll('.item-card').length;
      if (currentCards >= MAX_ITEMS) return;
      itemsContainer.appendChild(createItemCard(currentCards + 1, initial));
      renumberItems();
    }

    function buildPayload() {
      const payload = {};
      const formData = new FormData(orderForm);
      for (const [key, value] of formData.entries()) {
        payload[key] = value;
      }
      if (payload['希望納期']) {
        payload['希望納期'] = payload['希望納期'].replace(/-/g, '/');
      }

      const cards = Array.from(itemsContainer.querySelectorAll('.item-card'));
      for (let i = 1; i <= MAX_ITEMS; i++) {
        const card = cards[i - 1];
        ITEM_FIELDS.forEach((field) => {
          const input = card ? card.querySelector(`[data-field="${field}"]`) : null;
          payload[`${field}${i}`] = input ? input.value : '';
        });
      }
      return payload;
    }

    function updatePreview() {
      jsonPreview.textContent = JSON.stringify(buildPayload(), null, 2);
    }

    function formatDateYmd(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    userNameInput.addEventListener('change', () => {
      applyCustomerHistoryAutofill();
    });

    saveGasUrlBtn.addEventListener('click', () => {
      const url = gasUrlInput.value.trim();
      localStorage.setItem(STORAGE_KEY_GAS_URL, url);
      statusText.textContent = url ? 'GAS URLをブラウザに保存しました' : '保存済みGAS URLをクリアしました';
    });

    loadGasBtn.addEventListener('click', () => {
      loadCatalogFromGas(true);
    });

    document.querySelectorAll('.chip[data-preset]').forEach((chip) => {
      chip.addEventListener('click', () => {
        const preset = chip.dataset.preset;
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        if (preset === 'stock') {
          userNameInput.value = '在庫';
          destinationSelect.value = '貴社';
          applyCustomerHistoryAutofill();
        } else if (preset === 'store') {
          destinationSelect.value = '店渡し';
          document.getElementById('deliveryDate').value = formatDateYmd(today);
        } else if (preset === 'site') {
          destinationSelect.value = '現場';
        } else if (preset === 'direct') {
          destinationSelect.value = '直送';
        } else if (preset === 'tomorrow-am') {
          document.getElementById('deliveryDate').value = formatDateYmd(tomorrow);
          document.getElementById('deliveryTime').value = 'AM';
        }
        updatePreview();
        statusText.textContent = `プリセット「${chip.textContent}」を反映しました`;
      });
    });

    clearBasicBtn.addEventListener('click', () => {
      ['userName', 'contactPerson', 'phone', 'siteName', 'deliveryDate', 'deliveryRequest', 'orderSource', 'siteAddress', 'etcNote'].forEach((id) => {
        document.getElementById(id).value = '';
      });
      document.getElementById('deliveryTime').value = '';
      destinationSelect.value = '貴社';
      refreshGlobalSuggestions();
      updatePreview();
      statusText.textContent = '基本情報をクリアしました';
    });

    addItemBtn.addEventListener('click', () => {
      addItemRow({ 単位: '缶' });
      updatePreview();
    });

    previewBtn.addEventListener('click', () => {
      updatePreview();
      statusText.textContent = 'JSONプレビューを更新しました';
    });

    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = buildPayload();
      jsonPreview.textContent = JSON.stringify(data, null, 2);

      const gasUrl = gasUrlInput.value.trim();
      if (!gasUrl) {
        statusText.textContent = 'GAS URL未入力のため、画面プレビューのみ更新しました';
        return;
      }

      statusText.textContent = '送信中...';
      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        statusText.textContent = '送信リクエストを実行しました（シート反映を確認してください）';
      } catch (err) {
        statusText.textContent = `送信エラー: ${err.message}`;
      }
    });

    const savedUrl = localStorage.getItem(STORAGE_KEY_GAS_URL) || '';
    if (savedUrl) {
      gasUrlInput.value = savedUrl;
    }
    refreshGlobalSuggestions();
    addItemRow({ 単位: '缶' });
    updatePreview();
    if (savedUrl) {
      loadCatalogFromGas(false);
    }
  </script>
</body>
</html>
