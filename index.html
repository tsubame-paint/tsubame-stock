<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEB注文フォーム | つばめ塗料店</title>
  <style>
    :root {
      --primary: #0f4c81;
      --primary-hover: #09355c;
      --primary-soft: #e8f1f8;
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
      --danger: #cf222e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .header-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: var(--primary);
    }

    .header-card p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .req {
      display: inline-block;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    input[type="text"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid rgba(15, 76, 129, 0.25);
      border-color: var(--primary);
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    /* 納品場所区分タブ */
    .location-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .loc-tab {
      padding: 9px 6px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .loc-tab:hover {
      background: #f0f4f8;
    }

    .loc-tab.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .location-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: #fafbfc;
    }

    .history-select {
      margin-bottom: 8px;
      font-size: 14px;
      padding: 8px 10px;
      background: #fff;
    }

    .sub-field {
      margin-top: 10px;
    }

    .sub-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .item-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fafbfc;
    }

    .item-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      gap: 8px;
    }

    .item-top-grid {
      display: grid;
      grid-template-columns: 1.7fr 1.1fr;
      gap: 8px;
      align-items: start;
    }

    .item-bottom-grid {
      display: grid;
      grid-template-columns: 1.2fr 132px;
      gap: 8px;
      align-items: start;
      margin-top: 8px;
    }

    /* カード下部：複製ボタンエリア */
    .item-row-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #d8dee4;
    }

    .btn-duplicate-bottom {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      background: #fff;
      border: 1px solid #9ec5e5;
      border-radius: 6px;
      touch-action: manipulation;
    }

    .btn-duplicate-bottom:hover {
      background: var(--primary-soft);
    }

    /* 艶タブ */
    .gloss-tabs-wrap {
      margin-top: 8px;
    }

    .gloss-tabs-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      display: block;
    }

    .gloss-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .gloss-tab {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .gloss-tab:hover {
      background: #f0f4f8;
    }

    .gloss-tab.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty-btn {
      width: 38px;
      height: 42px;
      padding: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }

    .qty-btn:hover {
      background: #eef2f6;
    }

    .qty-stepper input.item-qty {
      width: 48px;
      text-align: center;
      padding: 10px 4px;
      -moz-appearance: textfield;
    }

    .qty-stepper input.item-qty::-webkit-outer-spin-button,
    .qty-stepper input.item-qty::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .unit-custom {
      margin-top: 6px;
    }

    .item-actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    .btn:hover {
      background: #f3f4f6;
    }

    .btn-stock {
      background: var(--primary-soft);
      border-color: #9ec5e5;
      color: var(--primary);
      font-weight: 700;
    }

    .btn-stock:hover {
      background: #d6e7f5;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-remove {
      padding: 5px 10px;
      min-height: 32px;
      font-size: 12px;
      color: var(--danger);
      border-color: #f3b7bd;
      background: #fff;
      touch-action: manipulation;
    }

    .btn-link-sm {
      padding: 4px 8px;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
    }

    .notice-bar {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .status-banner {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-success {
      display: block;
      background: #dafbe1;
      color: #116329;
      border: 1px solid #4ac26b;
    }

    .status-error {
      display: block;
      background: #ffebe9;
      color: #82071e;
      border: 1px solid #ff8182;
    }

    .receipt-box {
      margin-top: 10px;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #82e596;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* 確認モーダル */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      max-width: 520px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      font-size: 14px;
    }

    .confirm-block {
      margin-bottom: 14px;
    }

    .confirm-block-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .confirm-item-list {
      margin: 0;
      padding-left: 18px;
    }

    .confirm-item-list li {
      margin-bottom: 6px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .modal-footer .btn {
      flex: 1;
    }

    .modal-footer .btn-submit-confirm {
      flex: 1.4;
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    @media (max-width: 600px) {
      .item-top-grid,
      .item-bottom-grid {
        grid-template-columns: 1fr;
      }

      .qty-stepper {
        justify-content: flex-start;
      }

      .qty-stepper input.item-qty {
        width: 72px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <h1>WEB注文フォーム</h1>
      <p>必要事項をご入力のうえ、「注文内容を確認する」へお進みください。</p>
    </div>

    <div id="statusBanner" class="status-banner" role="alert"></div>

    <form id="orderForm" novalidate>
      <!-- お客様情報 -->
      <div class="section-card">
        <div class="section-title">
          <span>お客様情報</span>
          <button type="button" id="clearSavedBtn" class="btn btn-link-sm">前回入力を消去</button>
        </div>

        <div class="field">
          <label for="company">貴社名・お名前<span class="req">必須</span></label>
          <input type="text" id="company" name="company" required placeholder="例：〇〇塗装株式会社 山田" />
        </div>

        <div class="field">
          <label for="tel">電話番号（連絡先）<span class="req">必須</span></label>
          <input type="tel" id="tel" name="tel" required placeholder="例：090-1234-5678" />
        </div>

        <div class="field">
          <label>納品場所<span class="req">必須</span></label>
          <div class="location-tabs" role="tablist" aria-label="納品場所区分">
            <button type="button" class="loc-tab is-active" data-loc="貴社">貴社</button>
            <button type="button" class="loc-tab" data-loc="現場">現場</button>
            <button type="button" class="loc-tab" data-loc="倉庫">倉庫</button>
            <button type="button" class="loc-tab" data-loc="その他">その他</button>
          </div>

          <div class="location-box">
            <select id="locationHistorySelect" class="history-select" aria-label="過去の履歴から選択" style="display:none;">
              <option value="">過去の履歴から選ぶ...</option>
            </select>

            <div id="singleAddressWrap">
              <label id="singleAddressLabel" for="singleAddress" class="sub-label">貴社住所</label>
              <input type="text" id="singleAddress" placeholder="例：埼玉県熊谷市〇〇 1-2-3" />
            </div>

            <div id="otherAddressWrap" style="display:none;">
              <div>
                <label for="otherDesc" class="sub-label">説明</label>
                <input type="text" id="otherDesc" placeholder="例：〇〇様邸、〇〇営業所、置き配指定 など" />
              </div>
              <div class="sub-field">
                <label for="otherAddress" class="sub-label">住所</label>
                <input type="text" id="otherAddress" placeholder="例：群馬県前橋市〇〇 1-2-3" />
              </div>
            </div>

            <div class="notice-bar">※送信した内容は区分ごとの履歴に保存され、次回から選べます。</div>
          </div>
        </div>
      </div>

      <!-- ご注文内容 -->
      <div class="section-card">
        <div class="section-title">
          <span>ご注文商品</span>
        </div>

        <div id="itemsContainer"></div>

        <div class="item-actions-bar">
          <button type="button" id="addRowBtn" class="btn">＋ 商品行を追加</button>
          <button type="button" id="pickFromStockBtn" class="btn btn-stock">📦 在庫から選ぶ</button>
        </div>
        <div class="notice-bar">※「在庫から選ぶ」を押すと在庫一覧へ移動し、選んだ商品をまとめて注文行へ追加できます。</div>
      </div>

      <!-- 備考 -->
      <div class="section-card">
        <div class="section-title">
          <span>ご希望納期・備考</span>
        </div>
        <div class="field">
          <label for="notes">連絡事項・納品希望時間など</label>
          <textarea id="notes" name="notes" placeholder="例：明日午前中希望、現場着時に電話連絡希望 など"></textarea>
        </div>
      </div>

      <button type="submit" id="openConfirmBtn" class="btn btn-primary">注文内容を確認する</button>
    </form>
  </div>

  <!-- 確認モーダル -->
  <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div id="modalTitle" class="modal-header">ご注文内容の確認</div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" id="closeModalBtn" class="btn">修正する</button>
        <button type="button" id="finalSendBtn" class="btn btn-submit-confirm">この内容で送信する</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzuHLwm-bGvfXNuAWy-JX3HyIHYS23Z1dbIM5eE7xy4SeKQBqUUpK3Zemrgq5CQVW36/exec";
    const STOCK_LIST_URL = "https://tsubame-paint.github.io/tsubame-stock/order-sheet-v2.html";
    const STORAGE_KEY = "tsubame_web_order_customer_v4";
    const DRAFT_KEY = "tsubame_web_order_draft_v1";
    const SELECTED_STOCK_KEY = "tsubame_selected_stock_items_v1";

    const MAX_HISTORY_PER_TYPE = 15;
    const LOCATION_TYPES = ["貴社", "現場", "倉庫", "その他"];
    const UNIT_OPTIONS = ["15kg", "16kg", "4kg", "3kg", "1缶", "1箱", "その他"];
    const GLOSS_OPTIONS = ["指定なし", "艶有", "7分艶", "5分艶", "3分艶", "艶消"];

    const form = document.getElementById("orderForm");
    const itemsContainer = document.getElementById("itemsContainer");
    const addRowBtn = document.getElementById("addRowBtn");
    const pickFromStockBtn = document.getElementById("pickFromStockBtn");
    const clearSavedBtn = document.getElementById("clearSavedBtn");
    const statusBanner = document.getElementById("statusBanner");

    const locTabEls = document.querySelectorAll(".loc-tab");
    const locationHistorySelect = document.getElementById("locationHistorySelect");
    const singleAddressWrap = document.getElementById("singleAddressWrap");
    const singleAddressLabel = document.getElementById("singleAddressLabel");
    const singleAddressInput = document.getElementById("singleAddress");
    const otherAddressWrap = document.getElementById("otherAddressWrap");
    const otherDescInput = document.getElementById("otherDesc");
    const otherAddressInput = document.getElementById("otherAddress");

    const modal = document.getElementById("confirmModal");
    const modalBody = document.getElementById("modalBody");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const finalSendBtn = document.getElementById("finalSendBtn");

    let currentLocationType = "貴社";
    let historyByType = {
      "貴社": [],
      "現場": [],
      "倉庫": [],
      "その他": []
    };
    let pendingPayload = null;

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showBanner(type, message, receiptText = "") {
      statusBanner.className = "status-banner " + (type === "success" ? "status-success" : "status-error");
      statusBanner.innerHTML = "";

      const msgDiv = document.createElement("div");
      msgDiv.textContent = message;
      statusBanner.appendChild(msgDiv);

      if (receiptText) {
        const pre = document.createElement("div");
        pre.className = "receipt-box";
        pre.textContent = receiptText;
        statusBanner.appendChild(pre);
      }

      statusBanner.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideBanner() {
      statusBanner.className = "status-banner";
      statusBanner.innerHTML = "";
    }

    function updateLocationUI(type, applyLatestHistory = false) {
      currentLocationType = LOCATION_TYPES.includes(type) ? type : "貴社";
      locTabEls.forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.loc === currentLocationType);
      });

      if (currentLocationType === "その他") {
        singleAddressWrap.style.display = "none";
        otherAddressWrap.style.display = "block";
      } else {
        singleAddressWrap.style.display = "block";
        otherAddressWrap.style.display = "none";

        if (currentLocationType === "貴社") {
          singleAddressLabel.textContent = "貴社住所";
          singleAddressInput.placeholder = "例：埼玉県熊谷市〇〇 1-2-3（貴社）";
        } else if (currentLocationType === "現場") {
          singleAddressLabel.textContent = "現場住所";
          singleAddressInput.placeholder = "例：埼玉県熊谷市〇〇 〇〇現場";
        } else {
          singleAddressLabel.textContent = "倉庫住所";
          singleAddressInput.placeholder = "例：埼玉県深谷市〇〇 〇〇倉庫";
        }
      }

      const list = historyByType[currentLocationType] || [];
      renderLocationHistorySelect(list);

      if (applyLatestHistory && list.length > 0) {
        applyHistoryEntry(list[0]);
      }
    }

    function formatHistoryOptionText(entry) {
      if (typeof entry === "string") return entry;
      if (entry.type === "その他") {
        const parts = [entry.description, entry.address].filter(Boolean);
        return parts.join(" ／ ");
      }
      return entry.address || "";
    }

    function applyHistoryEntry(entry) {
      if (!entry) return;
      if (typeof entry === "string") {
        singleAddressInput.value = entry;
        return;
      }
      if (entry.type === "その他") {
        otherDescInput.value = entry.description || "";
        otherAddressInput.value = entry.address || "";
      } else {
        singleAddressInput.value = entry.address || "";
      }
    }

    function renderLocationHistorySelect(list) {
      locationHistorySelect.innerHTML = `<option value="">過去の${currentLocationType}履歴から選ぶ...</option>`;
      if (!Array.isArray(list) || list.length === 0) {
        locationHistorySelect.style.display = "none";
        return;
      }

      list.forEach((entry, idx) => {
        const opt = document.createElement("option");
        opt.value = String(idx);
        opt.textContent = formatHistoryOptionText(entry);
        locationHistorySelect.appendChild(opt);
      });
      locationHistorySelect.style.display = "block";
    }

    locationHistorySelect.addEventListener("change", () => {
      const idx = parseInt(locationHistorySelect.value, 10);
      const list = historyByType[currentLocationType] || [];
      if (Number.isFinite(idx) && list[idx]) {
        applyHistoryEntry(list[idx]);
      }
    });

    locTabEls.forEach((btn) => {
      btn.addEventListener("click", () => {
        updateLocationUI(btn.dataset.loc, true);
      });
    });

    function getLocationInputData() {
      if (currentLocationType === "その他") {
        const description = otherDescInput.value.trim();
        const address = otherAddressInput.value.trim();
        const combined = [description ? `説明：${description}` : "", address ? `住所：${address}` : ""]
          .filter(Boolean)
          .join(" ／ ");
        return {
          locationType: "その他",
          description,
          address,
          formattedAddress: combined
        };
      }

      const address = singleAddressInput.value.trim();
      return {
        locationType: currentLocationType,
        description: "",
        address,
        formattedAddress: address
      };
    }

    function mapUnitToFields(rawUnit) {
      const u = String(rawUnit || "").trim();
      if (!u) return { unitSelect: "", unitCustom: "" };
      if (UNIT_OPTIONS.includes(u) && u !== "その他") {
        return { unitSelect: u, unitCustom: "" };
      }
      return { unitSelect: "その他", unitCustom: u };
    }

    function createItemRow(initial = {}) {
      const initName = initial.name ?? "";
      const initColor = initial.color ?? "";
      const initGloss = GLOSS_OPTIONS.includes(initial.gloss) ? initial.gloss : "指定なし";
      const initUnitSelect = initial.unitSelect ?? "";
      const initUnitCustom = initial.unitCustom ?? "";
      const initQty = Number.isFinite(Number(initial.qty)) && Number(initial.qty) > 0 ? Number(initial.qty) : 1;

      const row = document.createElement("div");
      row.className = "item-row";

      const optionsHtml = UNIT_OPTIONS.map((unit) => {
        const label = unit === "その他" ? "その他（手入力）" : unit;
        const selected = unit === initUnitSelect ? " selected" : "";
        return `<option value="${escapeHtml(unit)}"${selected}>${escapeHtml(label)}</option>`;
      }).join("");

      const glossTabsHtml = GLOSS_OPTIONS.map((gloss) => {
        const activeClass = gloss === initGloss ? " is-active" : "";
        return `<button type="button" class="gloss-tab${activeClass}" data-gloss="${escapeHtml(gloss)}">${escapeHtml(gloss)}</button>`;
      }).join("");

      const customDisplayStyle = initUnitSelect === "その他" ? "block" : "none";

      row.innerHTML = `
        <div class="item-row-header">
          <span class="row-label">商品</span>
          <button type="button" class="btn btn-remove" aria-label="この行を削除">削除</button>
        </div>
        <div class="item-top-grid">
          <div>
            <label class="sub-label">商品名</label>
            <input type="text" class="item-name" value="${escapeHtml(initName)}" placeholder="例：水性セラミシリコン" />
          </div>
          <div>
            <label class="sub-label">色・色番</label>
            <input type="text" class="item-color" value="${escapeHtml(initColor)}" placeholder="例：ND-172、白、N-90" />
          </div>
        </div>
        <div class="gloss-tabs-wrap">
          <span class="gloss-tabs-label">艶指定</span>
          <div class="gloss-tabs" role="tablist" aria-label="艶指定">
            ${glossTabsHtml}
          </div>
        </div>
        <div class="item-bottom-grid">
          <div>
            <label class="sub-label">容量・単位</label>
            <select class="item-unit">
              <option value="">容量・単位を選択</option>
              ${optionsHtml}
            </select>
            <input type="text" class="item-unit-custom unit-custom" value="${escapeHtml(initUnitCustom)}" placeholder="容量を入力（例：18L、特注）" style="display:${customDisplayStyle};" />
          </div>
          <div>
            <label class="sub-label">数量</label>
            <div class="qty-stepper">
              <button type="button" class="qty-btn qty-minus" aria-label="数量を減らす">−</button>
              <input type="number" class="item-qty" inputmode="numeric" min="1" value="${escapeHtml(initQty)}" aria-label="数量" />
              <button type="button" class="qty-btn qty-plus" aria-label="数量を増やす">＋</button>
            </div>
          </div>
        </div>
        <div class="item-row-footer">
          <button type="button" class="btn btn-duplicate-bottom" aria-label="この商品を複製">＋ この商品を複製</button>
        </div>
      `;

      const nameEl = row.querySelector(".item-name");
      const colorEl = row.querySelector(".item-color");
      const selectEl = row.querySelector(".item-unit");
      const customEl = row.querySelector(".item-unit-custom");
      const qtyEl = row.querySelector(".item-qty");
      const minusBtn = row.querySelector(".qty-minus");
      const plusBtn = row.querySelector(".qty-plus");
      const dupBtn = row.querySelector(".btn-duplicate-bottom");
      const removeBtn = row.querySelector(".btn-remove");
      const glossTabEls = row.querySelectorAll(".gloss-tab");

      let selectedGloss = initGloss;

      // 数量欄にフォーカスしたときに数字を全選択してすぐ打ち換えられるようにする
      qtyEl.addEventListener("focus", () => {
        setTimeout(() => {
          qtyEl.select();
        }, 0);
      });

      // 入力途中で空欄や1未満になった場合は1に補正する
      qtyEl.addEventListener("blur", () => {
        const val = parseInt(qtyEl.value, 10);
        if (!Number.isFinite(val) || val < 1) {
          qtyEl.value = "1";
        }
      });

      glossTabEls.forEach((tabBtn) => {
        tabBtn.addEventListener("click", () => {
          selectedGloss = tabBtn.dataset.gloss || "指定なし";
          glossTabEls.forEach((b) => b.classList.toggle("is-active", b === tabBtn));
        });
      });

      selectEl.addEventListener("change", () => {
        if (selectEl.value === "その他") {
          customEl.style.display = "block";
          customEl.focus();
        } else {
          customEl.style.display = "none";
          customEl.value = "";
        }
      });

      minusBtn.addEventListener("click", () => {
        const current = parseInt(qtyEl.value, 10);
        const next = Number.isFinite(current) && current > 1 ? current - 1 : 1;
        qtyEl.value = String(next);
      });

      plusBtn.addEventListener("click", () => {
        const current = parseInt(qtyEl.value, 10);
        const next = Number.isFinite(current) && current >= 1 ? current + 1 : 2;
        qtyEl.value = String(next);
      });

      dupBtn.addEventListener("click", () => {
        const currentQty = parseInt(qtyEl.value, 10);
        const copiedRow = createItemRow({
          name: nameEl.value,
          color: colorEl.value,
          gloss: selectedGloss,
          unitSelect: selectEl.value,
          unitCustom: customEl.value,
          qty: Number.isFinite(currentQty) && currentQty > 0 ? currentQty : 1,
          insertAfter: true
        });
        row.insertAdjacentElement("afterend", copiedRow);
        refreshRowNumbers();
        copiedRow.scrollIntoView({ behavior: "smooth", block: "nearest" });
        copiedRow.querySelector(".item-name").focus({ preventScroll: true });
      });

      removeBtn.addEventListener("click", () => {
        if (itemsContainer.children.length <= 1) {
          nameEl.value = "";
          colorEl.value = "";
          selectedGloss = "指定なし";
          glossTabEls.forEach((b) => b.classList.toggle("is-active", b.dataset.gloss === "指定なし"));
          selectEl.value = "";
          customEl.value = "";
          customEl.style.display = "none";
          qtyEl.value = "1";
          return;
        }
        row.remove();
        refreshRowNumbers();
      });

      row.getItemData = () => {
        const name = nameEl.value.trim();
        const color = colorEl.value.trim();
        const unitSelect = selectEl.value;
        const unitCustom = customEl.value.trim();
        const qtyRaw = parseInt(qtyEl.value, 10);
        const qty = Number.isFinite(qtyRaw) && qtyRaw > 0 ? qtyRaw : 1;
        const unit = unitSelect === "その他" ? unitCustom : unitSelect;

        return {
          name,
          color,
          gloss: selectedGloss,
          unit,
          qty,
          _raw: {
            name,
            color,
            gloss: selectedGloss,
            unitSelect,
            unitCustom,
            qty
          }
        };
      };

      if (!initial.insertAfter) {
        itemsContainer.appendChild(row);
      }
      refreshRowNumbers();
      return row;
    }

    function refreshRowNumbers() {
      const rows = itemsContainer.querySelectorAll(".item-row");
      rows.forEach((row, idx) => {
        const labelEl = row.querySelector(".row-label");
        if (labelEl) labelEl.textContent = `商品 ${idx + 1}`;
      });
    }

    function collectItems() {
      const items = [];
      const rows = itemsContainer.querySelectorAll(".item-row");
      rows.forEach((row) => {
        if (typeof row.getItemData === "function") {
          const item = row.getItemData();
          if (item.name || item.color || item.unit || item.gloss !== "指定なし") {
            items.push({
              name: item.name,
              color: item.color,
              gloss: item.gloss,
              unit: item.unit,
              qty: item.qty
            });
          }
        }
      });
      return items;
    }

    function collectRawItemsForDraft() {
      const rawList = [];
      itemsContainer.querySelectorAll(".item-row").forEach((row) => {
        if (typeof row.getItemData === "function") {
          const d = row.getItemData();
          if (d._raw.name || d._raw.color || d._raw.unitSelect || d._raw.unitCustom || d._raw.gloss !== "指定なし") {
            rawList.push(d._raw);
          }
        }
      });
      return rawList;
    }

    function formatItemLabel(item) {
      const colorPart = item.color ? ` ／ 色：${item.color}` : "";
      const glossPart = item.gloss && item.gloss !== "指定なし" ? ` [${item.gloss}]` : "";
      return `${item.name}${colorPart}${glossPart} ／ ${item.unit} × ${item.qty}`;
    }

    function buildReceiptText(payload) {
      const lines = [
        `【WEB注文控え】`,
        `貴社名・お名前：${payload.company}`,
        `電話番号：${payload.tel}`,
        `納品場所（${payload.locationType}）：${payload.address}`,
        `--- ご注文商品 ---`,
        ...payload.items.map((it, i) => `${i + 1}. ${formatItemLabel(it)}`)
      ];
      if (payload.notes) {
        lines.push(`--- 備考 ---`, payload.notes);
      }
      return lines.join("\n");
    }

    function saveCustomerAndLocation(company, tel, locData) {
      try {
        const entry =
          locData.locationType === "その他"
            ? {
                type: "その他",
                description: locData.description,
                address: locData.address
              }
            : {
                type: locData.locationType,
                address: locData.address
              };

        const entryKey = JSON.stringify(entry);
        const prevList = Array.isArray(historyByType[locData.locationType])
          ? historyByType[locData.locationType]
          : [];

        const nextList = [
          entry,
          ...prevList.filter((item) => JSON.stringify(item) !== entryKey)
        ].slice(0, MAX_HISTORY_PER_TYPE);

        historyByType[locData.locationType] = nextList;

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            company,
            tel,
            lastLocationType: locData.locationType,
            historyByType
          })
        );

        renderLocationHistorySelect(nextList);
      } catch (e) {}
    }

    function loadSavedData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          updateLocationUI("貴社", false);
          return;
        }
        const saved = JSON.parse(raw);
        const companyEl = document.getElementById("company");
        const telEl = document.getElementById("tel");

        if (companyEl && !companyEl.value && saved.company) companyEl.value = saved.company;
        if (telEl && !telEl.value && saved.tel) telEl.value = saved.tel;

        if (saved.historyByType && typeof saved.historyByType === "object") {
          LOCATION_TYPES.forEach((t) => {
            if (Array.isArray(saved.historyByType[t])) {
              historyByType[t] = saved.historyByType[t];
            }
          });
        }

        const initialType = LOCATION_TYPES.includes(saved.lastLocationType)
          ? saved.lastLocationType
          : "貴社";
        updateLocationUI(initialType, true);
      } catch (e) {
        updateLocationUI("貴社", false);
      }
    }

    function saveDraftBeforeStock_() {
      try {
        const draft = {
          company: document.getElementById("company").value,
          tel: document.getElementById("tel").value,
          locationType: currentLocationType,
          singleAddress: singleAddressInput.value,
          otherDesc: otherDescInput.value,
          otherAddress: otherAddressInput.value,
          notes: document.getElementById("notes").value,
          rawItems: collectRawItemsForDraft()
        };
        localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      } catch (e) {}
    }

    function applyReturnedStockItems_() {
      let draft = null;
      try {
        const rawDraft = localStorage.getItem(DRAFT_KEY);
        if (rawDraft) draft = JSON.parse(rawDraft);
      } catch (e) {}

      let picked = [];
      try {
        const rawPicked = localStorage.getItem(SELECTED_STOCK_KEY);
        if (rawPicked) picked = JSON.parse(rawPicked);
      } catch (e) {}

      const hasPicked = Array.isArray(picked) && picked.length > 0;
      if (!draft && !hasPicked) return;

      if (draft) {
        if (draft.company) document.getElementById("company").value = draft.company;
        if (draft.tel) document.getElementById("tel").value = draft.tel;
        if (draft.locationType) updateLocationUI(draft.locationType, false);
        if (draft.singleAddress) singleAddressInput.value = draft.singleAddress;
        if (draft.otherDesc) otherDescInput.value = draft.otherDesc;
        if (draft.otherAddress) otherAddressInput.value = draft.otherAddress;
        if (draft.notes) document.getElementById("notes").value = draft.notes;
      }

      const combinedRows = [];
      if (draft && Array.isArray(draft.rawItems)) {
        combinedRows.push(...draft.rawItems);
      }

      if (hasPicked) {
        picked.forEach((p) => {
          const mapped = mapUnitToFields(p.unit);
          combinedRows.push({
            name: p.name || "",
            color: p.color || "",
            gloss: GLOSS_OPTIONS.includes(p.gloss) ? p.gloss : "指定なし",
            unitSelect: mapped.unitSelect,
            unitCustom: mapped.unitCustom,
            qty: Number.isFinite(Number(p.qty)) && Number(p.qty) > 0 ? Number(p.qty) : 1
          });
        });
      }

      if (combinedRows.length > 0) {
        itemsContainer.innerHTML = "";
        combinedRows.forEach((rowInit) => createItemRow(rowInit));
      }

      if (hasPicked) {
        showBanner("success", `在庫一覧から ${picked.length} 件の商品を追加しました。数量や艶をご確認ください。`);
      }

      try {
        localStorage.removeItem(DRAFT_KEY);
        localStorage.removeItem(SELECTED_STOCK_KEY);
      } catch (e) {}
    }

    pickFromStockBtn.addEventListener("click", () => {
      saveDraftBeforeStock_();
      const returnUrl = encodeURIComponent(window.location.href.split("#")[0]);
      window.location.href = `${STOCK_LIST_URL}?fromOrder=1&returnUrl=${returnUrl}`;
    });

    clearSavedBtn.addEventListener("click", () => {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(DRAFT_KEY);
      } catch (e) {}
      historyByType = { "貴社": [], "現場": [], "倉庫": [], "その他": [] };
      document.getElementById("company").value = "";
      document.getElementById("tel").value = "";
      singleAddressInput.value = "";
      otherDescInput.value = "";
      otherAddressInput.value = "";
      updateLocationUI("貴社", false);
      showBanner("success", "前回入力・納品場所履歴をクリアしました。");
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      hideBanner();

      const company = document.getElementById("company").value.trim();
      const tel = document.getElementById("tel").value.trim();
      const locData = getLocationInputData();
      const notes = document.getElementById("notes").value.trim();
      const items = collectItems();

      if (!company || !tel) {
        showBanner("error", "「貴社名・お名前」「電話番号」は必須です。");
        return;
      }

      if (locData.locationType === "その他") {
        if (!locData.description || !locData.address) {
          showBanner("error", "「その他」を選択した場合は、「説明」と「住所」の両方を入力してください。");
          return;
        }
      } else if (!locData.address) {
        showBanner("error", `「${singleAddressLabel.textContent}」を入力してください。`);
        return;
      }

      if (items.length === 0) {
        showBanner("error", "ご注文商品を1点以上入力してください。");
        return;
      }

      const missingField = items.find((it) => !it.name || !it.unit);
      if (missingField) {
        showBanner("error", "入力中の商品行について、「商品名」と「容量・単位」の両方を確認してください。");
        return;
      }

      pendingPayload = {
        submittedAt: new Date().toISOString(),
        company,
        tel,
        locationType: locData.locationType,
        locationDescription: locData.description,
        address: locData.formattedAddress,
        rawAddress: locData.address,
        items,
        notes
      };

      const itemsHtml = items
        .map((it, i) => {
          const colorBadge = it.color ? ` ／ 色：<strong>${escapeHtml(it.color)}</strong>` : "";
          const glossBadge = it.gloss && it.gloss !== "指定なし" ? ` 【${escapeHtml(it.gloss)}】` : "";
          return `<li><strong>${i + 1}.</strong> ${escapeHtml(it.name)}${colorBadge}${glossBadge} ／ <strong>${escapeHtml(it.unit)}</strong> ／ 数量：<strong>${escapeHtml(it.qty)}</strong></li>`;
        })
        .join("");

      modalBody.innerHTML = `
        <div class="confirm-block">
          <div class="confirm-block-title">貴社名・お名前</div>
          <div>${escapeHtml(company)}</div>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">電話番号</div>
          <div>${escapeHtml(tel)}</div>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">納品場所（${escapeHtml(locData.locationType)}）</div>
          <div>${escapeHtml(locData.formattedAddress)}</div>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">ご注文商品</div>
          <ul class="confirm-item-list">${itemsHtml}</ul>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">ご希望納期・備考</div>
          <div>${notes ? escapeHtml(notes).replace(/\n/g, "<br>") : "（なし）"}</div>
        </div>
      `;

      modal.classList.add("is-open");
    });

    closeModalBtn.addEventListener("click", () => {
      modal.classList.remove("is-open");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("is-open");
      }
    });

    finalSendBtn.addEventListener("click", async () => {
      if (!pendingPayload) return;

      finalSendBtn.disabled = true;
      closeModalBtn.disabled = true;
      finalSendBtn.textContent = "送信中...";

      try {
        if (GAS_ENDPOINT_URL) {
          await fetch(GAS_ENDPOINT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(pendingPayload)
          });
        }

        saveCustomerAndLocation(pendingPayload.company, pendingPayload.tel, {
          locationType: pendingPayload.locationType,
          description: pendingPayload.locationDescription,
          address: pendingPayload.rawAddress
        });

        const receiptText = buildReceiptText(pendingPayload);

        modal.classList.remove("is-open");
        showBanner(
          "success",
          GAS_ENDPOINT_URL
            ? "ご注文を送信しました。ありがとうございました。"
            : "確認処理が完了しました（GAS_ENDPOINT_URL を設定すると実送信されます）。",
          receiptText
        );

        itemsContainer.innerHTML = "";
        createItemRow();
        document.getElementById("notes").value = "";
        pendingPayload = null;
      } catch (err) {
        modal.classList.remove("is-open");
        showBanner("error", "送信中にエラーが発生しました。通信環境をご確認のうえ再度お試しください。");
      } finally {
        finalSendBtn.disabled = false;
        closeModalBtn.disabled = false;
        finalSendBtn.textContent = "この内容で送信する";
      }
    });

    addRowBtn.addEventListener("click", () => {
      const newRow = createItemRow();
      newRow.querySelector(".item-name").focus();
    });

    createItemRow();
    loadSavedData();
    applyReturnedStockItems_();
  </script>
</body>
</html>
