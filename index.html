<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEB注文フォーム | つばめ塗料店</title>
  <style>
    :root {
      --primary: #0f4c81;
      --primary-hover: #09355c;
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
      --danger: #cf222e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .header-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: var(--primary);
    }

    .header-card p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .req {
      display: inline-block;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    input[type="text"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid rgba(15, 76, 129, 0.25);
      border-color: var(--primary);
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    .item-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fafbfc;
    }

    .item-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      gap: 8px;
    }

    .row-actions {
      display: flex;
      gap: 6px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 132px;
      gap: 8px;
      align-items: start;
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty-btn {
      width: 38px;
      height: 42px;
      padding: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }

    .qty-btn:hover {
      background: #eef2f6;
    }

    .qty-stepper input.item-qty {
      width: 48px;
      text-align: center;
      padding: 10px 4px;
      -moz-appearance: textfield;
    }

    .qty-stepper input.item-qty::-webkit-outer-spin-button,
    .qty-stepper input.item-qty::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .unit-custom {
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    .btn:hover {
      background: #f3f4f6;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-duplicate {
      padding: 4px 10px;
      font-size: 12px;
      color: var(--primary);
      border-color: #b6d0e8;
      background: #fff;
    }

    .btn-remove {
      padding: 4px 10px;
      font-size: 12px;
      color: var(--danger);
      border-color: #f3b7bd;
      background: #fff;
    }

    .btn-link-sm {
      padding: 4px 8px;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
    }

    .notice-bar {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .status-banner {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-success {
      display: block;
      background: #dafbe1;
      color: #116329;
      border: 1px solid #4ac26b;
    }

    .status-error {
      display: block;
      background: #ffebe9;
      color: #82071e;
      border: 1px solid #ff8182;
    }

    .receipt-box {
      margin-top: 10px;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #82e596;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* 確認モーダル */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      max-width: 520px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      font-size: 14px;
    }

    .confirm-block {
      margin-bottom: 14px;
    }

    .confirm-block-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .confirm-item-list {
      margin: 0;
      padding-left: 18px;
    }

    .confirm-item-list li {
      margin-bottom: 6px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .modal-footer .btn {
      flex: 1;
    }

    .modal-footer .btn-submit-confirm {
      flex: 1.4;
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    @media (max-width: 600px) {
      .item-grid {
        grid-template-columns: 1fr;
      }

      .qty-stepper {
        justify-content: flex-start;
      }

      .qty-stepper input.item-qty {
        width: 72px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <h1>WEB注文フォーム</h1>
      <p>必要事項をご入力のうえ、「注文内容を確認する」へお進みください。</p>
    </div>

    <div id="statusBanner" class="status-banner" role="alert"></div>

    <form id="orderForm" novalidate>
      <!-- お客様情報 -->
      <div class="section-card">
        <div class="section-title">
          <span>お客様情報</span>
          <button type="button" id="clearSavedBtn" class="btn btn-link-sm">前回入力を消去</button>
        </div>

        <div class="field">
          <label for="company">貴社名・お名前<span class="req">必須</span></label>
          <input type="text" id="company" name="company" required placeholder="例：〇〇塗装株式会社 山田" />
        </div>

        <div class="field">
          <label for="tel">電話番号（連絡先）<span class="req">必須</span></label>
          <input type="tel" id="tel" name="tel" required placeholder="例：090-1234-5678" />
        </div>

        <div class="field">
          <label for="address">納品先住所・現場名<span class="req">必須</span></label>
          <input type="text" id="address" name="address" required placeholder="例：埼玉県熊谷市〇〇 〇〇現場" />
          <div class="notice-bar">※一度送信すると、次回から会社名・電話番号・納品先が自動入力されます。</div>
        </div>
      </div>

      <!-- ご注文内容 -->
      <div class="section-card">
        <div class="section-title">
          <span>ご注文商品</span>
        </div>

        <div id="itemsContainer"></div>

        <button type="button" id="addRowBtn" class="btn">＋ 商品行を追加</button>
        <div class="notice-bar">※塗料は「艶有・7分艶・5分艶・3分艶・艶消」などの艶指定もあわせてご記入ください。</div>
      </div>

      <!-- 備考 -->
      <div class="section-card">
        <div class="section-title">
          <span>ご希望納期・備考</span>
        </div>
        <div class="field">
          <label for="notes">連絡事項・納品希望時間など</label>
          <textarea id="notes" name="notes" placeholder="例：明日午前中希望、現場着時に電話連絡希望 など"></textarea>
        </div>
      </div>

      <button type="submit" id="openConfirmBtn" class="btn btn-primary">注文内容を確認する</button>
    </form>
  </div>

  <!-- 確認モーダル -->
  <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div id="modalTitle" class="modal-header">ご注文内容の確認</div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-footer">
        <button type="button" id="closeModalBtn" class="btn">修正する</button>
        <button type="button" id="finalSendBtn" class="btn btn-submit-confirm">この内容で送信する</button>
      </div>
    </div>
  </div>

  <script>
    // ★ デプロイしたGAS WebアプリURLを設定してください
    const GAS_ENDPOINT_URL = "";
    const STORAGE_KEY = "tsubame_web_order_customer_v1";
    const UNIT_OPTIONS = ["15kg", "16kg", "4kg", "3kg", "1缶", "1箱", "その他"];

    const form = document.getElementById("orderForm");
    const itemsContainer = document.getElementById("itemsContainer");
    const addRowBtn = document.getElementById("addRowBtn");
    const clearSavedBtn = document.getElementById("clearSavedBtn");
    const statusBanner = document.getElementById("statusBanner");

    const modal = document.getElementById("confirmModal");
    const modalBody = document.getElementById("modalBody");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const finalSendBtn = document.getElementById("finalSendBtn");

    let pendingPayload = null;

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showBanner(type, message, receiptText = "") {
      statusBanner.className = "status-banner " + (type === "success" ? "status-success" : "status-error");
      statusBanner.innerHTML = "";

      const msgDiv = document.createElement("div");
      msgDiv.textContent = message;
      statusBanner.appendChild(msgDiv);

      if (receiptText) {
        const pre = document.createElement("div");
        pre.className = "receipt-box";
        pre.textContent = receiptText;
        statusBanner.appendChild(pre);
      }

      statusBanner.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideBanner() {
      statusBanner.className = "status-banner";
      statusBanner.innerHTML = "";
    }

    function createItemRow(initial = {}) {
      const initName = initial.name ?? "";
      const initUnitSelect = initial.unitSelect ?? "";
      const initUnitCustom = initial.unitCustom ?? "";
      const initQty = Number.isFinite(Number(initial.qty)) && Number(initial.qty) > 0 ? Number(initial.qty) : 1;

      const row = document.createElement("div");
      row.className = "item-row";

      const optionsHtml = UNIT_OPTIONS.map((unit) => {
        const label = unit === "その他" ? "その他（手入力）" : unit;
        const selected = unit === initUnitSelect ? " selected" : "";
        return `<option value="${escapeHtml(unit)}"${selected}>${escapeHtml(label)}</option>`;
      }).join("");

      const customDisplayStyle = initUnitSelect === "その他" ? "block" : "none";

      row.innerHTML = `
        <div class="item-row-header">
          <span class="row-label">商品</span>
          <div class="row-actions">
            <button type="button" class="btn btn-duplicate" aria-label="この行を複製">複製</button>
            <button type="button" class="btn btn-remove" aria-label="この行を削除">削除</button>
          </div>
        </div>
        <div class="item-grid">
          <div>
            <input type="text" class="item-name" value="${escapeHtml(initName)}" placeholder="商品名・色番・艶（例：水性セラミシリコン ND-172 艶有）" />
          </div>
          <div>
            <select class="item-unit">
              <option value="">容量・単位を選択</option>
              ${optionsHtml}
            </select>
            <input type="text" class="item-unit-custom unit-custom" value="${escapeHtml(initUnitCustom)}" placeholder="容量を入力（例：18L、特注）" style="display:${customDisplayStyle};" />
          </div>
          <div>
            <div class="qty-stepper">
              <button type="button" class="qty-btn qty-minus" aria-label="数量を減らす">−</button>
              <input type="number" class="item-qty" inputmode="numeric" min="1" value="${escapeHtml(initQty)}" aria-label="数量" />
              <button type="button" class="qty-btn qty-plus" aria-label="数量を増やす">＋</button>
            </div>
          </div>
        </div>
      `;

      const nameEl = row.querySelector(".item-name");
      const selectEl = row.querySelector(".item-unit");
      const customEl = row.querySelector(".item-unit-custom");
      const qtyEl = row.querySelector(".item-qty");
      const minusBtn = row.querySelector(".qty-minus");
      const plusBtn = row.querySelector(".qty-plus");
      const dupBtn = row.querySelector(".btn-duplicate");
      const removeBtn = row.querySelector(".btn-remove");

      selectEl.addEventListener("change", () => {
        if (selectEl.value === "その他") {
          customEl.style.display = "block";
          customEl.focus();
        } else {
          customEl.style.display = "none";
          customEl.value = "";
        }
      });

      minusBtn.addEventListener("click", () => {
        const current = parseInt(qtyEl.value, 10);
        const next = Number.isFinite(current) && current > 1 ? current - 1 : 1;
        qtyEl.value = String(next);
      });

      plusBtn.addEventListener("click", () => {
        const current = parseInt(qtyEl.value, 10);
        const next = Number.isFinite(current) && current >= 1 ? current + 1 : 2;
        qtyEl.value = String(next);
      });

      dupBtn.addEventListener("click", () => {
        const currentQty = parseInt(qtyEl.value, 10);
        const copiedRow = createItemRow({
          name: nameEl.value,
          unitSelect: selectEl.value,
          unitCustom: customEl.value,
          qty: Number.isFinite(currentQty) && currentQty > 0 ? currentQty : 1
        });
        row.insertAdjacentElement("afterend", copiedRow);
        refreshRowNumbers();
        copiedRow.querySelector(".item-name").focus();
      });

      removeBtn.addEventListener("click", () => {
        if (itemsContainer.children.length <= 1) {
          nameEl.value = "";
          selectEl.value = "";
          customEl.value = "";
          customEl.style.display = "none";
          qtyEl.value = "1";
          return;
        }
        row.remove();
        refreshRowNumbers();
      });

      if (!initial.insertAfter) {
        itemsContainer.appendChild(row);
      }
      refreshRowNumbers();
      return row;
    }

    function refreshRowNumbers() {
      const rows = itemsContainer.querySelectorAll(".item-row");
      rows.forEach((row, idx) => {
        const labelEl = row.querySelector(".row-label");
        if (labelEl) labelEl.textContent = `商品 ${idx + 1}`;
      });
    }

    function collectItems() {
      const items = [];
      const rows = itemsContainer.querySelectorAll(".item-row");
      rows.forEach((row) => {
        const name = row.querySelector(".item-name").value.trim();
        const unitSelect = row.querySelector(".item-unit").value;
        const unitCustom = row.querySelector(".item-unit-custom").value.trim();
        const qtyRaw = parseInt(row.querySelector(".item-qty").value, 10);
        const qty = Number.isFinite(qtyRaw) && qtyRaw > 0 ? qtyRaw : 1;
        const unit = unitSelect === "その他" ? unitCustom : unitSelect;

        if (name || unit) {
          items.push({
            name,
            unit,
            qty
          });
        }
      });
      return items;
    }

    function buildReceiptText(payload) {
      const lines = [
        `【WEB注文控え】`,
        `貴社名・お名前：${payload.company}`,
        `電話番号：${payload.tel}`,
        `納品先：${payload.address}`,
        `--- ご注文商品 ---`,
        ...payload.items.map((it, i) => `${i + 1}. ${it.name} / ${it.unit} × ${it.qty}`)
      ];
      if (payload.notes) {
        lines.push(`--- 備考 ---`, payload.notes);
      }
      return lines.join("\n");
    }

    function saveCustomerInfo(company, tel, address) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ company, tel, address }));
      } catch (e) {}
    }

    function loadCustomerInfo() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        const companyEl = document.getElementById("company");
        const telEl = document.getElementById("tel");
        const addressEl = document.getElementById("address");

        if (companyEl && !companyEl.value && saved.company) companyEl.value = saved.company;
        if (telEl && !telEl.value && saved.tel) telEl.value = saved.tel;
        if (addressEl && !addressEl.value && saved.address) addressEl.value = saved.address;
      } catch (e) {}
    }

    clearSavedBtn.addEventListener("click", () => {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      document.getElementById("company").value = "";
      document.getElementById("tel").value = "";
      document.getElementById("address").value = "";
      showBanner("success", "前回入力の保存情報をクリアしました。");
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      hideBanner();

      const company = document.getElementById("company").value.trim();
      const tel = document.getElementById("tel").value.trim();
      const address = document.getElementById("address").value.trim();
      const notes = document.getElementById("notes").value.trim();
      const items = collectItems();

      if (!company || !tel || !address) {
        showBanner("error", "「貴社名・お名前」「電話番号」「納品先住所・現場名」は必須です。");
        return;
      }

      if (items.length === 0) {
        showBanner("error", "ご注文商品を1点以上入力してください。");
        return;
      }

      const missingUnit = items.find((it) => !it.name || !it.unit);
      if (missingUnit) {
        showBanner("error", "入力中の商品行について、「商品名・色番・艶」と「容量・単位」の両方を確認してください。");
        return;
      }

      pendingPayload = {
        submittedAt: new Date().toISOString(),
        company,
        tel,
        address,
        items,
        notes
      };

      const itemsHtml = items
        .map(
          (it, i) =>
            `<li><strong>${i + 1}.</strong> ${escapeHtml(it.name)} ／ <strong>${escapeHtml(it.unit)}</strong> ／ 数量：<strong>${escapeHtml(it.qty)}</strong></li>`
        )
        .join("");

      modalBody.innerHTML = `
        <div class="confirm-block">
          <div class="confirm-block-title">貴社名・お名前</div>
          <div>${escapeHtml(company)}</div>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">電話番号</div>
          <div>${escapeHtml(tel)}</div>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">納品先住所・現場名</div>
          <div>${escapeHtml(address)}</div>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">ご注文商品</div>
          <ul class="confirm-item-list">${itemsHtml}</ul>
        </div>
        <div class="confirm-block">
          <div class="confirm-block-title">ご希望納期・備考</div>
          <div>${notes ? escapeHtml(notes).replace(/\n/g, "<br>") : "（なし）"}</div>
        </div>
      `;

      modal.classList.add("is-open");
    });

    closeModalBtn.addEventListener("click", () => {
      modal.classList.remove("is-open");
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("is-open");
      }
    });

    finalSendBtn.addEventListener("click", async () => {
      if (!pendingPayload) return;

      finalSendBtn.disabled = true;
      closeModalBtn.disabled = true;
      finalSendBtn.textContent = "送信中...";

      try {
        if (GAS_ENDPOINT_URL) {
          await fetch(GAS_ENDPOINT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(pendingPayload)
          });
        }

        saveCustomerInfo(pendingPayload.company, pendingPayload.tel, pendingPayload.address);
        const receiptText = buildReceiptText(pendingPayload);

        modal.classList.remove("is-open");
        showBanner(
          "success",
          GAS_ENDPOINT_URL
            ? "ご注文を送信しました。ありがとうございました。"
            : "確認処理が完了しました（GAS_ENDPOINT_URL を設定すると実送信されます）。",
          receiptText
        );

        itemsContainer.innerHTML = "";
        createItemRow();
        document.getElementById("notes").value = "";
        pendingPayload = null;
      } catch (err) {
        modal.classList.remove("is-open");
        showBanner("error", "送信中にエラーが発生しました。通信環境をご確認のうえ再度お試しください。");
      } finally {
        finalSendBtn.disabled = false;
        closeModalBtn.disabled = false;
        finalSendBtn.textContent = "この内容で送信する";
      }
    });

    addRowBtn.addEventListener("click", () => {
      const newRow = createItemRow();
      newRow.querySelector(".item-name").focus();
    });

    createItemRow();
    loadCustomerInfo();
  </script>
</body>
</html>
